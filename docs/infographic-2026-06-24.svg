<text x="40" y="960" font-size="16" font-weight="bold" fill="#111111">Raspberry Pi Pico W Turned Into a USB Wi-Fi Adapter</text>
<text x="40" y="982" font-size="12" fill="#666666">A developer published firmware that repurposes the $6 Raspberry Pi Pico W microcontroller</text>
<text x="40" y="998" font-size="12" fill="#666666">board as a USB Wi-Fi adapter for other devices. The project shows the board&#x27;s Wi-Fi chip can</text>
<circle cx="44" cy="1004" r="2.5" fill="#00897B"/>
<text x="54" y="1008" font-size="11.5" fill="#444444">Project hosted on GitLab, drew 206 points on Hacker News</text>
<circle cx="44" cy="1021" r="2.5" fill="#00897B"/>
<text x="54" y="1025" font-size="11.5" fill="#444444">Uses the Pico W&#x27;s existing Infineon Wi-Fi chip rather than added hardware</text>
<circle cx="44" cy="1038" r="2.5" fill="#00897B"/>
<text x="54" y="1042" font-size="11.5" fill="#444444">Offers a sub-$10 path to add wireless connectivity to USB host devices</text>
