<text x="40" y="770" font-size="16" font-weight="bold" fill="#111111">Founder Details €9,600 Cost of Starting a German Company</text>
<text x="40" y="792" font-size="12" fill="#666666">Entrepreneur Carmine Paolino published a detailed timeline of founding his second company in</text>
<text x="40" y="808" font-size="12" fill="#666666">Germany, showing 152 days and over 9,600 euros spent on legal, notary, and tax fees without</text>
<circle cx="44" cy="814" r="2.5" fill="#2E7D32"/>
<text x="54" y="818" font-size="11.5" fill="#444444">Total cost so far: more than 9,600 euros, including 2,000 euros of frozen share capital</text>
<circle cx="44" cy="831" r="2.5" fill="#2E7D32"/>
<text x="54" y="835" font-size="11.5" fill="#444444">Process spanned 152 days from first law-firm call to still-incomplete registration</text>
