<text x="40" y="390" font-size="16" font-weight="bold" fill="#111111">Maintainer: Vulnerability Reports Lost Their Special Status</text>
<text x="40" y="412" font-size="12" fill="#666666">Filippo Valsorda, former lead of the Go Security team, argues that the traditional bargain</text>
<text x="40" y="428" font-size="12" fill="#666666">around security disclosures is breaking down now that LLMs can generate vulnerability</text>
<circle cx="44" cy="434" r="2.5" fill="#00897B"/>
<text x="54" y="438" font-size="11.5" fill="#444444">Piece reached 346 points on Hacker News</text>
<circle cx="44" cy="451" r="2.5" fill="#00897B"/>
<text x="54" y="455" font-size="11.5" fill="#444444">Argument centers on LLMs matching human security researchers&#x27; analysis quality</text>
<circle cx="44" cy="468" r="2.5" fill="#00897B"/>
<text x="54" y="472" font-size="11.5" fill="#444444">Author previously led security policy for the Go programming language team</text>
