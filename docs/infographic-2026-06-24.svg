<text x="40" y="580" font-size="16" font-weight="bold" fill="#111111">Microsoft Engineer Behind Spellcheck Squiggles Remembered</text>
<text x="40" y="602" font-size="12" fill="#666666">Microsoft&#x27;s Raymond Chen wrote a tribute to Tony Krueger, the engineer who implemented the</text>
<text x="40" y="618" font-size="12" fill="#666666">red and green squiggly underlines for spelling and grammar errors in early versions of</text>
<circle cx="44" cy="624" r="2.5" fill="#00897B"/>
<text x="54" y="628" font-size="11.5" fill="#444444">Krueger worked on Word versions 1.0 through 6.0 and beyond across two decades</text>
<circle cx="44" cy="641" r="2.5" fill="#00897B"/>
<text x="54" y="645" font-size="11.5" fill="#444444">He also ported the game Chip&#x27;s Challenge to Windows for the Windows Entertainment Pack</text>
<circle cx="44" cy="658" r="2.5" fill="#00897B"/>
<text x="54" y="662" font-size="11.5" fill="#444444">Tribute post drew 526 points on Hacker News</text>
