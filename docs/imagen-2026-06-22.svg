<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg" font-family="'Helvetica Neue', Arial, sans-serif">
  <rect width="1080" height="1080" fill="#FFFFFF"/>

  <!-- Title box -->
  <rect x="30" y="30" width="430" height="60" fill="none" stroke="#111" stroke-width="2.5" rx="2"/>
  <text x="245" y="58" text-anchor="middle" font-size="15" fill="#111" font-weight="700" letter-spacing="1">POWERING THE AI BOOM</text>
  <text x="245" y="78" text-anchor="middle" font-size="11" fill="#555">Technical Editorial Illustration &#183; June 22, 2026</text>

  <!-- Site outline -->
  <rect x="60" y="140" width="960" height="800" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- LEFT: Gas turbine power plant -->
  <text x="240" y="170" text-anchor="middle" font-size="11" fill="#111" font-weight="700">NATURAL GAS POWER PLANT</text>

  <!-- Turbine hall building -->
  <rect x="110" y="200" width="280" height="220" fill="#F2F2F0" stroke="#333" stroke-width="2.5"/>
  <text x="250" y="230" text-anchor="middle" font-size="10" fill="#333" font-weight="700">TURBINE HALL</text>
  <text x="250" y="244" text-anchor="middle" font-size="9" fill="#666">steel frame &#183; concrete slab</text>

  <!-- Combustion turbine generator (cutaway) -->
  <g fill="none" stroke="#222" stroke-width="2">
    <rect x="150" y="270" width="200" height="60" rx="8"/>
    <circle cx="190" cy="300" r="22"/>
    <circle cx="190" cy="300" r="10"/>
    <line x1="212" y1="300" x2="330" y2="300" stroke-dasharray="3,3"/>
  </g>
  <text x="250" y="350" text-anchor="middle" font-size="9" fill="#222" font-weight="700">COMBUSTION TURBINE GENERATOR</text>
  <line x1="250" y1="335" x2="250" y2="330" stroke="#222" stroke-width="1"/>

  <!-- Exhaust stacks -->
  <rect x="160" y="120" width="22" height="85" fill="none" stroke="#222" stroke-width="2"/>
  <rect x="200" y="100" width="22" height="105" fill="none" stroke="#222" stroke-width="2"/>
  <text x="280" y="120" font-size="9" fill="#222" font-weight="700">EXHAUST STACKS</text>
  <line x1="225" y1="125" x2="270" y2="120" stroke="#222" stroke-width="1"/>
  <path d="M171 118 q4 -16 -3 -28" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="2,2"/>
  <path d="M211 98 q4 -16 -3 -28" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="2,2"/>
  <text x="160" y="85" font-size="8" fill="#999">heat exhaust</text>

  <!-- Gas supply line -->
  <line x1="60" y1="300" x2="150" y2="300" stroke="#222" stroke-width="3"/>
  <polygon points="148,295 158,300 148,305" fill="#222"/>
  <text x="65" y="290" font-size="9" fill="#222" font-weight="700">NATURAL GAS IN</text>

  <!-- Step-up transformer -->
  <rect x="150" y="440" width="80" height="50" fill="none" stroke="#222" stroke-width="2"/>
  <circle cx="170" cy="465" r="8" fill="none" stroke="#222" stroke-width="1.5"/>
  <circle cx="190" cy="465" r="8" fill="none" stroke="#222" stroke-width="1.5"/>
  <circle cx="210" cy="465" r="8" fill="none" stroke="#222" stroke-width="1.5"/>
  <text x="190" y="510" text-anchor="middle" font-size="9" fill="#222" font-weight="700">STEP-UP TRANSFORMER</text>
  <text x="190" y="522" text-anchor="middle" font-size="8" fill="#666">copper windings</text>

  <!-- Switchyard -->
  <g stroke="#222" stroke-width="1.5" fill="none">
    <line x1="280" y1="440" x2="280" y2="560"/>
    <line x1="320" y1="440" x2="320" y2="560"/>
    <line x1="360" y1="440" x2="360" y2="560"/>
    <line x1="260" y1="460" x2="380" y2="460"/>
    <line x1="260" y1="500" x2="380" y2="500"/>
  </g>
  <text x="320" y="580" text-anchor="middle" font-size="9" fill="#222" font-weight="700">SWITCHYARD</text>
  <text x="320" y="592" text-anchor="middle" font-size="8" fill="#666">high-voltage lines</text>

  <!-- Scale marker left -->
  <line x1="110" y1="650" x2="390" y2="650" stroke="#111" stroke-width="1.5"/>
  <line x1="110" y1="644" x2="110" y2="656" stroke="#111" stroke-width="1.5"/>
  <line x1="390" y1="644" x2="390" y2="656" stroke="#111" stroke-width="1.5"/>
  <text x="250" y="670" text-anchor="middle" font-size="10" fill="#111">approx. 85 m plant footprint</text>

  <!-- Power transmission arrow center -->
  <path d="M 400 460 C 480 420 560 420 640 460" fill="none" stroke="#111" stroke-width="2.5" stroke-dasharray="2,4"/>
  <polygon points="645,465 632,452 634,470" fill="#111"/>
  <text x="520" y="400" text-anchor="middle" font-size="11" fill="#111" font-weight="700">ELECTRICITY OUT</text>
  <text x="520" y="414" text-anchor="middle" font-size="9" fill="#555">20-year supply agreement</text>

  <!-- RIGHT: Data center -->
  <text x="800" y="170" text-anchor="middle" font-size="11" fill="#111" font-weight="700">AI DATA CENTER, WEST TEXAS</text>

  <rect x="650" y="200" width="320" height="380" fill="#F2F2F0" stroke="#333" stroke-width="2.5"/>
  <text x="810" y="225" text-anchor="middle" font-size="10" fill="#333" font-weight="700">SERVER WAREHOUSE</text>
  <text x="810" y="239" text-anchor="middle" font-size="9" fill="#666">tilt-up concrete &#183; windowless</text>

  <!-- Cutaway showing server racks -->
  <rect x="670" y="260" width="280" height="200" fill="none" stroke="#222" stroke-width="2" stroke-dasharray="5,3"/>
  <g stroke="#222" stroke-width="1.5" fill="none">
    <rect x="690" y="280" width="30" height="160"/>
    <rect x="730" y="280" width="30" height="160"/>
    <rect x="770" y="280" width="30" height="160"/>
    <rect x="810" y="280" width="30" height="160"/>
    <rect x="850" y="280" width="30" height="160"/>
    <rect x="890" y="280" width="30" height="160"/>
  </g>
  <g stroke="#999" stroke-width="0.75">
    <line x1="690" y1="300" x2="920" y2="300"/>
    <line x1="690" y1="320" x2="920" y2="320"/>
    <line x1="690" y1="340" x2="920" y2="340"/>
    <line x1="690" y1="360" x2="920" y2="360"/>
    <line x1="690" y1="380" x2="920" y2="380"/>
    <line x1="690" y1="400" x2="920" y2="400"/>
    <line x1="690" y1="420" x2="920" y2="420"/>
  </g>
  <text x="810" y="478" text-anchor="middle" font-size="9" fill="#222" font-weight="700">GPU SERVER RACKS</text>
  <line x1="810" y1="463" x2="810" y2="460" stroke="#222" stroke-width="1"/>

  <!-- Cable trays -->
  <line x1="670" y1="500" x2="950" y2="500" stroke="#222" stroke-width="3"/>
  <line x1="670" y1="506" x2="950" y2="506" stroke="#222" stroke-width="1"/>
  <text x="950" y="500" font-size="9" fill="#222" font-weight="700" text-anchor="end">CABLE TRAYS</text>

  <!-- Cooling pipes -->
  <line x1="670" y1="540" x2="950" y2="540" stroke="#5588AA" stroke-width="4"/>
  <text x="950" y="535" font-size="9" fill="#5588AA" font-weight="700" text-anchor="end">CHILLED-WATER COOLING PIPES</text>
  <path d="M955 540 l10 -5 l0 10 z" fill="#5588AA"/>

  <!-- Scale marker right -->
  <line x1="650" y1="630" x2="970" y2="630" stroke="#111" stroke-width="1.5"/>
  <line x1="650" y1="624" x2="650" y2="636" stroke="#111" stroke-width="1.5"/>
  <line x1="970" y1="624" x2="970" y2="636" stroke="#111" stroke-width="1.5"/>
  <text x="810" y="650" text-anchor="middle" font-size="10" fill="#111">approx. 110 m warehouse length</text>

  <!-- Bottom annotation block -->
  <rect x="60" y="950" width="960" height="100" fill="none" stroke="#111" stroke-width="1.5"/>
  <text x="80" y="973" font-size="11" fill="#111" font-weight="700">CHEVRON &amp; MICROSOFT &#8212; WEST TEXAS, 2026</text>
  <text x="80" y="990" font-size="10" fill="#555">Chevron signed a 20-year agreement to supply natural-gas-fired electricity directly to a new Microsoft AI data center.</text>
  <text x="80" y="1006" font-size="10" fill="#555">The deal illustrates how a single large AI training cluster can demand as much power as a small city, pushing</text>
  <text x="80" y="1022" font-size="10" fill="#555">hyperscalers toward dedicated, long-term generation contracts rather than relying on the public grid.</text>

</svg>
