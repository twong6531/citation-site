<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Briefing Archive</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0d0d0d;
    --bg2: #141414;
    --bg3: #1a1a1a;
    --border: #2a2a2a;
    --text: #e8e8e8;
    --muted: #666;
    --accent: #f0f0f0;
  }
  body { background: var(--bg); color: var(--text); font-family: 'Helvetica Neue', Arial, sans-serif; min-height: 100vh; }
  
  .top-bar { height: 4px; background: #f0f0f0; }
  
  header { padding: 40px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: flex-end; }
  .header-title { font-size: 24px; font-weight: 700; color: var(--accent); }
  .header-sub { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .header-count { font-size: 11px; color: var(--muted); }
  .header-links { display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
  .header-links a { color: var(--muted); text-decoration: none; font-size: 12px; border: 1px solid var(--border); padding: 8px 14px; }
  .header-links a:hover { color: var(--accent); border-color: var(--accent); }
  
  .featured-section { padding: 40px; border-bottom: 1px solid var(--border); }
  .section-label { font-size: 10px; letter-spacing: 2px; color: var(--muted); font-weight: 600; margin-bottom: 24px; }
  
  .featured-card { background: var(--bg2); border: 1px solid var(--border); padding: 32px; display: grid; grid-template-columns: 1fr auto; grid-template-rows: auto; gap: 12px 24px; max-width: 900px; }
  .featured-label { font-size: 9px; letter-spacing: 2px; font-weight: 600; color: var(--muted); grid-column: 1; }
  .featured-topic { font-size: 32px; font-weight: 700; color: var(--accent); grid-column: 1; line-height: 1.2; }
  .featured-date { font-size: 13px; color: var(--muted); grid-column: 1; }
  .featured-links { display: flex; gap: 12px; grid-column: 1; }
  .featured-cta { display: inline-block; background: var(--accent); color: #000; text-decoration: none; font-size: 12px; font-weight: 700; padding: 10px 20px; }
  .featured-download { display: inline-block; border: 1px solid var(--border); color: var(--muted); text-decoration: none; font-size: 12px; padding: 10px 16px; }
  .featured-download:hover { color: var(--accent); border-color: var(--accent); }
  .featured-thumb { grid-column: 2; grid-row: 1 / 5; width: 180px; border: 1px solid var(--border); }
  
  .archive-section { padding: 40px; }
  .archive-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1px; background: var(--border); margin-top: 0; }
  .archive-card { background: var(--bg2); padding: 20px; text-decoration: none; color: var(--text); display: block; transition: background 0.15s; }
  .archive-card:hover { background: var(--bg3); }
  .arc-date { font-size: 10px; color: var(--muted); margin-bottom: 6px; letter-spacing: 0.5px; }
  .arc-topic { font-size: 14px; font-weight: 600; color: var(--accent); line-height: 1.35; }
  
  footer { padding: 30px 40px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: var(--muted); }
  .bottom-bar { height: 3px; background: #f0f0f0; }
  
  @media (max-width: 600px) {
    header { flex-direction: column; gap: 16px; align-items: flex-start; }
    .featured-card { grid-template-columns: 1fr; }
    .featured-thumb { grid-column: 1; width: 100%; max-width: 300px; }
  }
</style>
</head>
<body>
<div class="top-bar"></div>

<header>
  <div>
    <div class="header-title">DAILY BRIEFING</div>
    <div class="header-sub">AI-generated tech news infographics · Updated daily</div>
  </div>
  <div class="header-links">
    <a href="research.html">Transit Research Archive →</a>
    <span class="header-count">2 EDITIONS</span>
  </div>
</header>

<section class="featured-section">
  <div class="section-label">LATEST</div>
  <div class="featured-card">
    <div class="featured-label">TODAY'S BRIEFING</div>
    <div class="featured-topic">AI Tools Shape Open Source</div>
    <div class="featured-date">June 6, 2026</div>
    <div class="featured-links">
      <a href="2026-06-06.html" class="featured-cta">Read Full Briefing →</a>
      <a href="infographic-2026-06-06.svg" class="featured-download">↓ SVG</a>
    </div>
    <img src="infographic-2026-06-06.svg" class="featured-thumb" alt="Today's infographic">
  </div>
</section>

<section class="archive-section">
  <div class="section-label">ARCHIVE</div>
  <div class="archive-grid">
    <a href="2026-06-05.html" class="archive-card">
      <div class="arc-date">June 5, 2026</div>
      <div class="arc-topic">Daily Briefing</div>
    </a>
  </div>
</section>

<footer>
  <span>Daily Briefing · 2 editions published</span>
  <span>June 6, 2026</span>
</footer>
<div class="bottom-bar"></div>
</body>
</html>
