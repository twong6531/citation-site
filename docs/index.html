<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Briefing Archive</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0D0D0D; color: #E8E8E8; font-family: 'Helvetica Neue', Arial, sans-serif; min-height: 100vh; }
  header { background: #111; border-bottom: 1px solid #222; padding: 24px 40px; display: flex; justify-content: space-between; align-items: center; }
  header .title { font-size: 13px; font-weight: 600; letter-spacing: 3px; color: #888; text-transform: uppercase; }
  header .subtitle { font-size: 22px; font-weight: 700; color: #FFF; margin-top: 6px; }
  header .count { font-size: 12px; color: #555; margin-top: 4px; }
  .nav-links { display: flex; gap: 24px; }
  .nav-link { color: #6C47FF; text-decoration: none; font-size: 13px; font-weight: 600; letter-spacing: 1px; }
  .nav-link:hover { color: #8B6FFF; }
  .container { max-width: 1200px; margin: 0 auto; padding: 40px 20px; }
  .featured-today { margin-bottom: 48px; }
  .section-label { font-size: 11px; letter-spacing: 3px; color: #555; text-transform: uppercase; margin-bottom: 20px; font-weight: 600; }
  .today-card { background: #111; border: 1px solid #2A2A2A; border-left: 3px solid #6C47FF; padding: 32px; border-radius: 2px; display: flex; justify-content: space-between; align-items: center; }
  .today-card .info .label { font-size: 11px; color: #555; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 8px; }
  .today-card .info .date { font-size: 13px; color: #888; margin-top: 6px; }
  .today-card .info .topic { font-size: 24px; font-weight: 700; color: #FFF; }
  .today-card .thumb img { max-width: 200px; opacity: 0.85; }
  .today-link { display: inline-flex; align-items: center; gap: 8px; padding: 12px 24px; background: #6C47FF; color: #FFF; text-decoration: none; font-size: 13px; font-weight: 600; border-radius: 2px; margin-top: 16px; }
  .today-link:hover { background: #5935D4; }
  .archive-section { margin-bottom: 40px; }
  .past-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1px; background: #1A1A1A; border: 1px solid #1A1A1A; }
  .past-card { background: #111; padding: 20px; text-decoration: none; display: block; transition: background 0.15s; }
  .past-card:hover { background: #161616; }
  .past-date { font-size: 11px; color: #555; margin-bottom: 8px; }
  .past-topic { font-size: 14px; font-weight: 600; color: #CCC; line-height: 1.3; }
  footer { border-top: 1px solid #1A1A1A; padding: 24px 40px; display: flex; justify-content: space-between; align-items: center; margin-top: 20px; }
  footer p { font-size: 11px; color: #444; }
  footer a { color: #6C47FF; text-decoration: none; }
</style>
</head>
<body>
<header>
  <div>
    <div class="title">Daily Briefing</div>
    <div class="subtitle">Archive</div>
    <div class="count">2 editions published</div>
  </div>
  <div class="nav-links">
    <a href="research.html" class="nav-link">Transit Research Archive →</a>
  </div>
</header>
<div class="container">
  <div class="featured-today">
    <div class="section-label">Today's Edition</div>
    <div class="today-card">
      <div class="info">
        <div class="label">Latest Briefing</div>
        <div class="topic">AI Industry Shifts</div>
        <div class="date">June 6, 2026</div>
        <a href="2026-06-06.html" class="today-link">Read Today's Briefing →</a>
      </div>
      <div class="thumb">
        <img src="infographic-2026-06-06.svg" alt="Today's infographic">
      </div>
    </div>
  </div>
  <div class="archive-section">
    <div class="section-label">Past Editions</div>
    <div class="past-grid">
      
    <a href="2026-06-05.html" class="past-card">
      <div class="past-date">June 5, 2026</div>
      <div class="past-topic">Daily Briefing</div>
    </a>
    </div>
  </div>
</div>
<footer>
  <p>Daily AI-generated news briefings · <a href="research.html">Transit Research Archive</a></p>
  <p>2 total editions</p>
</footer>
</body>
</html>
