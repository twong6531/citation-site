  <text x="32" y="373" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="700">2</text>
  <rect x="56" y="355" width="52" height="20" rx="10" fill="#00897B"/>
  <text x="82" y="369" text-anchor="middle" font-size="9" fill="#FFFFFF" font-weight="700">TECH</text>
  <text x="760" y="369" text-anchor="end" font-size="10" fill="#00897B" font-weight="700">IMPACT 7/10</text>
  <text x="56" y="395" font-size="16" fill="#111111" font-weight="700">Homebrew 6.0 Ships New Tap</text>
  <text x="56" y="415" font-size="16" fill="#111111" font-weight="700">Security and macOS 27 Support</text>
  <text x="56" y="437" font-size="12" fill="#555555">Homebrew 6.0.0 introduces a tap trust security mechanism, a faster JSON</text>
  <text x="56" y="452" font-size="12" fill="#555555">package API, Linux sandboxing, and initial support for macOS 27 Golden Gate.</text>
  <text x="56" y="471" font-size="11" fill="#333333">▸  HN score: 1,349 — most-upvoted story of the day</text>
  <text x="56" y="486" font-size="11" fill="#333333">▸  New JSON API significantly reduces package metadata fetch times</text>
  <text x="56" y="501" font-size="11" fill="#333333">▸  brew bundle improvements streamline multi-machine developer setups</text>
