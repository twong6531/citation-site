  <rect x="56" y="548" width="52" height="20" rx="10" fill="#00897B"/>
  <text x="82" y="562" text-anchor="middle" font-size="9" fill="#FFFFFF" font-weight="700">TECH</text>
  <text x="760" y="562" text-anchor="end" font-size="10" fill="#00897B" font-weight="700">IMPACT 9/10</text>
  <text x="56" y="588" font-size="16" fill="#111111" font-weight="700">400+ Arch Linux AUR Packages</text>
  <text x="56" y="608" font-size="16" fill="#111111" font-weight="700">Infected with Rootkit and Infostealer</text>
  <text x="56" y="630" font-size="12" fill="#555555">Over 400 packages in the Arch User Repository were found carrying malware</text>
  <text x="56" y="645" font-size="12" fill="#555555">including an infostealer and rootkit — affecting thousands of Linux developers.</text>
  <text x="56" y="664" font-size="11" fill="#333333">▸  400+ compromised packages published to AUR supply chain</text>
  <text x="56" y="679" font-size="11" fill="#333333">▸  Rootkit establishes persistence; infostealer harvests credentials</text>
  <text x="56" y="694" font-size="11" fill="#333333">▸  AUR packages receive no official security vetting before publication</text>
