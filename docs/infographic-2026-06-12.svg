  <text x="56" y="1258" font-size="11" fill="#333333">▸  Token efficiency improvements reduce inference costs substantially</text>
  <text x="56" y="1273" font-size="11" fill="#333333">▸  Available on HuggingFace for unrestricted commercial use</text>
