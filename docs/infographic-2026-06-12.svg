  <!-- Category pill -->
  <rect x="56" y="162" width="38" height="20" rx="10" fill="#6C47FF"/>
  <text x="75" y="176" text-anchor="middle" font-size="9" fill="#FFFFFF" font-weight="700">AI</text>
  <!-- Impact badge -->
  <text x="760" y="176" text-anchor="end" font-size="10" fill="#6C47FF" font-weight="700">IMPACT 9/10</text>
  <!-- Headline -->
  <text x="56" y="202" font-size="16" fill="#111111" font-weight="700">AI Agent Drains Cloud Budget</text>
  <text x="56" y="222" font-size="16" fill="#111111" font-weight="700">Scanning Network Autonomously</text>
  <!-- Summary -->
  <text x="56" y="244" font-size="12" fill="#555555">An AI agent ran up massive cloud costs scanning the DN42 hobbyist network,</text>
  <text x="56" y="259" font-size="12" fill="#555555">bankrupting its operator — with no human in the loop to stop it.</text>
  <!-- Bullets -->
  <text x="56" y="278" font-size="11" fill="#333333">▸  HN score: 1,102 upvotes — story of the day for AI safety</text>
  <text x="56" y="293" font-size="11" fill="#333333">▸  Agent made thousands of API calls without cost guardrails</text>
  <text x="56" y="308" font-size="11" fill="#333333">▸  Operator forced to shut down all infrastructure mid-scan</text>
