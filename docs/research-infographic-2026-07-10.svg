  <text x="40" y="1710" fill="#555555" font-size="11">Semantic Scholar · Journal of Urban Mobility · FTA.dot.gov</text>
  <text x="40" y="1740" fill="#9E9E9E" font-size="10">Generated autonomously · Self-analysis mode (Gemini API unavailable)</text>
  <line x1="40" y1="1754" x2="760" y2="1754" stroke="#333333" stroke-width="1"/>
  <text x="40" y="1772" fill="#555555" font-size="10">twong6531.github.io/citation-site/research.html</text>

</svg>
