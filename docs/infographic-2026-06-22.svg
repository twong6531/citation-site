<text x="40" y="770" font-size="16" font-weight="bold" fill="#111111">OpenAI Codex Bug Writes Terabytes to SSDs</text>
<text x="40" y="792" font-size="12" fill="#666666">A critical bug in OpenAI&#x27;s Codex CLI tool can silently write terabytes of data to local</text>
<text x="40" y="808" font-size="12" fill="#666666">solid-state drives. This defect risks rapid storage exhaustion and accelerates SSD wear,</text>
<circle cx="44" cy="834" r="2.5" fill="#00897B"/>
<text x="54" y="838" font-size="11.5" fill="#444444">The bug report is on OpenAI&#x27;s Codex CLI tool.</text>
<circle cx="44" cy="851" r="2.5" fill="#00897B"/>
<text x="54" y="855" font-size="11.5" fill="#444444">It can silently write terabytes (TBs) of data to local SSDs.</text>
<circle cx="44" cy="868" r="2.5" fill="#00897B"/>
<text x="54" y="872" font-size="11.5" fill="#444444">Risks include storage exhaustion and accelerated drive wear.</text>
<text x="40" y="886" font-size="10" fill="#999999" font-weight="600">IMPACT</text>
