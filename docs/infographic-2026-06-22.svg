<text x="40" y="200" font-size="16" font-weight="bold" fill="#111111">Microsoft Secures 20-Year Power for AI Data Center</text>
<text x="40" y="222" font-size="12" fill="#666666">Microsoft has signed a 20-year power agreement with Chevron to supply electricity to a new AI</text>
<text x="40" y="238" font-size="12" fill="#666666">data center in West Texas. This long-term deal highlights the immense and growing energy</text>
<circle cx="44" cy="264" r="2.5" fill="#2E7D32"/>
<text x="54" y="268" font-size="11.5" fill="#444444">Chevron will provide power for 20 years to a Microsoft AI data center.</text>
<circle cx="44" cy="281" r="2.5" fill="#2E7D32"/>
<text x="54" y="285" font-size="11.5" fill="#444444">The new AI data center will be located in West Texas.</text>
<circle cx="44" cy="298" r="2.5" fill="#2E7D32"/>
<text x="54" y="302" font-size="11.5" fill="#444444">The agreement underscores the significant energy demands of AI infrastructure</text>
