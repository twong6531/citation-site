<text x="40" y="390" font-size="16" font-weight="bold" fill="#111111">Apertus: Open, Sovereign AI for Europe</text>
<text x="40" y="412" font-size="12" fill="#666666">A Swiss AI initiative (EPFL, ETH Zurich, CSCS) launched Apertus, an open foundation model with</text>
<text x="40" y="428" font-size="12" fill="#666666">8B and 70B parameter versions. Trained on over 1000 languages, it aims for &#x27;sovereign AI&#x27; use,</text>
<circle cx="44" cy="454" r="2.5" fill="#6C47FF"/>
<text x="54" y="458" font-size="11.5" fill="#444444">Apertus offers fully open foundation models in 8B and 70B parameter sizes.</text>
<circle cx="44" cy="471" r="2.5" fill="#6C47FF"/>
<text x="54" y="475" font-size="11.5" fill="#444444">It was trained on over 1000 languages, fostering linguistic diversity.</text>
<circle cx="44" cy="488" r="2.5" fill="#6C47FF"/>
<text x="54" y="492" font-size="11.5" fill="#444444">Designed for EU AI Act compliance, including PII removal and opt-out respect.</text>
<text x="40" y="506" font-size="10" fill="#999999" font-weight="600">IMPACT</text>
