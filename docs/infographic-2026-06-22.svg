<text x="40" y="1150" font-size="16" font-weight="bold" fill="#111111">Tiny AI Model Matches Giant Inpainting Performance</text>
<text x="40" y="1172" font-size="12" fill="#666666">Moebius, a new open image inpainting model with just 200 million parameters, claims performance</text>
<text x="40" y="1188" font-size="12" fill="#666666">comparable to much larger 10-billion-parameter models. This breakthrough suggests significant</text>
<circle cx="44" cy="1214" r="2.5" fill="#6C47FF"/>
<text x="54" y="1218" font-size="11.5" fill="#444444">Moebius is a 0.2B (200 million) parameter image inpainting model.</text>
<circle cx="44" cy="1231" r="2.5" fill="#6C47FF"/>
<text x="54" y="1235" font-size="11.5" fill="#444444">It claims performance level of 10-billion-parameter models.</text>
<circle cx="44" cy="1248" r="2.5" fill="#6C47FF"/>
<text x="54" y="1252" font-size="11.5" fill="#444444">The model is open, developed by hustvl.github.io.</text>
