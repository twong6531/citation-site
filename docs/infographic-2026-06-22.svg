<text x="40" y="580" font-size="16" font-weight="bold" fill="#111111">Deno Desktop Turns Web Apps into Binaries</text>
<text x="40" y="602" font-size="12" fill="#666666">Deno 2.9 (canary) introduces Deno Desktop, allowing developers to package any TypeScript or</text>
<text x="40" y="618" font-size="12" fill="#666666">JavaScript project into a self-contained desktop binary. This feature bundles the Deno runtime</text>
<circle cx="44" cy="644" r="2.5" fill="#00897B"/>
<text x="54" y="648" font-size="11.5" fill="#444444">Deno Desktop ships in Deno 2.9 (currently canary release).</text>
<circle cx="44" cy="661" r="2.5" fill="#00897B"/>
<text x="54" y="665" font-size="11.5" fill="#444444">It allows packaging any TypeScript/JS project, including Next.js apps.</text>
<circle cx="44" cy="678" r="2.5" fill="#00897B"/>
<text x="54" y="682" font-size="11.5" fill="#444444">The output is a self-contained, redistributable desktop binary per platform.</text>
<text x="40" y="696" font-size="10" fill="#999999" font-weight="600">IMPACT</text>
