<text x="40" y="960" font-size="16" font-weight="bold" fill="#111111">Protecting Privacy from Facial Recognition Surveillance</text>
<text x="40" y="982" font-size="12" fill="#666666">A new awareness site, &#x27;Never Give Them Your Face,&#x27; discusses the significant risks associated</text>
<text x="40" y="998" font-size="12" fill="#666666">with facial recognition technology and surveillance. It aims to educate individuals on how to</text>
<circle cx="44" cy="1024" r="2.5" fill="#E65100"/>
<text x="54" y="1028" font-size="11.5" fill="#444444">The website is &#x27;nevergivethemyourface.com&#x27;.</text>
<circle cx="44" cy="1041" r="2.5" fill="#E65100"/>
<text x="54" y="1045" font-size="11.5" fill="#444444">It addresses risks of facial recognition technology.</text>
<circle cx="44" cy="1058" r="2.5" fill="#E65100"/>
<text x="54" y="1062" font-size="11.5" fill="#444444">It raises awareness about privacy and surveillance.</text>
