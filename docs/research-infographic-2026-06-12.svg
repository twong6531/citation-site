<text x="40" y="62" font-size="22" fill="#ffffff" font-weight="700" letter-spacing="1">June 12, 2026</text>
<text x="40" y="83" font-size="10" fill="#888" letter-spacing="2">arXiv · 12 PAPERS ANALYZED</text>
<text x="760" y="55" font-size="10" fill="#666" text-anchor="end">EDITION 12-JUN-2026</text>
<line x1="40" y1="120" x2="760" y2="120" stroke="#cccccc" stroke-width="0.5"/>
<text x="40" y="136" font-size="9" fill="#1a1a1a" letter-spacing="3" font-weight="700">KEY FINDINGS</text>
<rect x="40" y="152" width="36" height="36" fill="#1a1a1a"/>
<text x="58" y="176" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">1</text>
<text x="90" y="166" font-size="13" fill="#1a1a1a" font-weight="700">Traffic Congestion is a Phase Transition</text>
<text x="90" y="180" font-size="11" fill="#555">Effective thermodynamic temperature predicts fragility across 54</text>
<text x="90" y="194" font-size="11" fill="#555">cities—the standard MFD is incomplete.</text>
<rect x="40" y="232" width="36" height="36" fill="#1a1a1a"/>
<text x="58" y="256" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">2</text>
<text x="90" y="246" font-size="13" fill="#1a1a1a" font-weight="700">Sequential Learning Cures Transit Deserts</text>
<text x="90" y="260" font-size="11" fill="#555">POMDP-based planning remediates 53.6% of transit-desert tracts in 5</text>
<text x="90" y="274" font-size="11" fill="#555">years without prior ridership data.</text>
<rect x="40" y="312" width="36" height="36" fill="#1a1a1a"/>
<text x="58" y="336" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">3</text>
<text x="90" y="326" font-size="13" fill="#1a1a1a" font-weight="700">Hierarchical Coherence Cuts Forecast Error 17%</text>
<text x="90" y="340" font-size="11" fill="#555">Neural reconciliation of station-level and OD forecasts reduces</text>
<text x="90" y="354" font-size="11" fill="#555">disruption prediction errors by up to 17.45%.</text>
<line x1="40" y1="392" x2="760" y2="392" stroke="#cccccc" stroke-width="0.5"/>
<text x="40" y="408" font-size="9" fill="#1a1a1a" letter-spacing="3" font-weight="700">PAPER OF THE DAY</text>
<rect x="40" y="424" width="720" height="2" fill="#1a1a1a"/>
<rect x="40" y="434" width="720" height="90" fill="#1a1a1a" rx="2"/>
<text x="56" y="452" font-size="13" fill="#ffffff" font-weight="700">Thermodynamic Phase Transitions Reveal the Resilience</text>
<text x="56" y="469" font-size="13" fill="#ffffff" font-weight="700">Structure of Urban Traffic Congestion</text>
<text x="56" y="488" font-size="10" fill="#aaa" letter-spacing="1">Luis E. Olmos · arXiv:2605.03879</text>
<text x="40" y="534" font-size="11" fill="#333">City-scale congestion follows a thermodynamic order-disorder phase transition. An</text>
<text x="40" y="550" font-size="11" fill="#333">'effective temperature' quantifies infrastructural heterogeneity and predicts</text>
<text x="40" y="566" font-size="11" fill="#333">congestion fragility—validated across 54 cities on 3 continents. The standard</text>
<text x="40" y="582" font-size="11" fill="#333">macroscopic fundamental diagram is shown to be an incomplete projection of a</text>
<text x="40" y="598" font-size="11" fill="#333">richer free-energy landscape.</text>
<line x1="40" y1="632" x2="760" y2="632" stroke="#cccccc" stroke-width="0.5"/>
<text x="40" y="648" font-size="9" fill="#1a1a1a" letter-spacing="3" font-weight="700">EMERGING THEMES</text>
<rect x="40" y="664" width="220" height="3" fill="#1a1a1a"/>
<text x="40" y="676" font-size="12" fill="#1a1a1a" font-weight="700">Phase-Transition Physics</text>
<text x="40" y="696" font-size="10" fill="#555">Congestion is not gradual—it's</text>
<text x="40" y="710" font-size="10" fill="#555">a brittle thermodynamic</text>
<text x="40" y="724" font-size="10" fill="#555">collapse predictable by</text>
<text x="40" y="738" font-size="10" fill="#555">infrastructure heterogeneity.</text>
<rect x="280" y="664" width="220" height="3" fill="#333"/>
<text x="280" y="676" font-size="12" fill="#1a1a1a" font-weight="700">Hierarchical Coherence as</text>
<text x="280" y="692" font-size="12" fill="#1a1a1a" font-weight="700">Imperative</text>
<text x="280" y="712" font-size="10" fill="#555">Neural reconciliation is</text>
<text x="280" y="726" font-size="10" fill="#555">emerging as essential:</text>
<text x="280" y="740" font-size="10" fill="#555">incoherent forecasts cause</text>
<text x="280" y="754" font-size="10" fill="#555">cascading operational</text>
<text x="280" y="768" font-size="10" fill="#555">failures.</text>
<rect x="520" y="664" width="220" height="3" fill="#555"/>
<text x="520" y="676" font-size="12" fill="#1a1a1a" font-weight="700">Global South Data</text>
<text x="520" y="692" font-size="12" fill="#1a1a1a" font-weight="700">Infrastructure</text>
<text x="520" y="712" font-size="10" fill="#555">NetMob26 (Niterói) and</text>
<text x="520" y="726" font-size="10" fill="#555">transit-desert POMDP mark</text>
<text x="520" y="740" font-size="10" fill="#555">serious field-wide attention</text>
<text x="520" y="754" font-size="10" fill="#555">to equity and data scarcity.</text>
