<text x="40" y="986" font-size="9" fill="#1a1a1a" letter-spacing="3" font-weight="700">ACTIONABLE TAKEAWAYS</text>
<text x="40" y="1002" font-size="10" fill="#888" font-weight="700">→</text>
<text x="56" y="1002" font-size="11" fill="#333">Deploy transit service sequentially using POMDP demand learning—observe ridership</text>
<text x="56" y="1016" font-size="11" fill="#333">before committing to full expansion</text>
<text x="40" y="1040" font-size="10" fill="#888" font-weight="700">→</text>
<text x="56" y="1040" font-size="11" fill="#333">Model secondary helper-line degradation in disruption plans—coordinated multimodal</text>
<text x="56" y="1054" font-size="11" fill="#333">response consistently wins</text>
<text x="40" y="1078" font-size="10" fill="#888" font-weight="700">→</text>
<text x="56" y="1078" font-size="11" fill="#333">Use genetic algorithm + SUMO for traffic simulation in data-scarce cities; a</text>
<text x="56" y="1092" font-size="11" fill="#333">handful of sensors suffices</text>
<text x="40" y="1116" font-size="10" fill="#888" font-weight="700">→</text>
<text x="56" y="1116" font-size="11" fill="#333">Implement mobility-sentiment FCA rules for crisis early warning with 2–7 day lead</text>
<text x="56" y="1130" font-size="11" fill="#333">times</text>
