<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg" font-family="'Helvetica Neue', Arial, sans-serif">
  <!-- White background -->
  <rect width="1080" height="1080" fill="#FFFFFF"/>

  <!-- Title box (hand-drawn annotation style) -->
  <rect x="30" y="30" width="380" height="60" fill="none" stroke="#111" stroke-width="2.5" rx="2"/>
  <text x="220" y="58" text-anchor="middle" font-size="15" fill="#111" font-weight="700" letter-spacing="1">AMOC: ATLANTIC OCEAN CONVEYOR BELT</text>
  <text x="220" y="78" text-anchor="middle" font-size="11" fill="#555">Technical Editorial Illustration · June 14, 2026</text>

  <!-- Ocean background shape - North Atlantic -->
  <ellipse cx="540" cy="540" rx="460" ry="420" fill="#E8F4FD" stroke="#BBBBCC" stroke-width="1.5"/>

  <!-- Cold blob - anomalous cold region south of Greenland -->
  <ellipse cx="430" cy="310" rx="120" ry="90" fill="#BDD7EE" stroke="#2255AA" stroke-width="2.5" stroke-dasharray="8,4"/>
  <text x="430" y="305" text-anchor="middle" font-size="11" fill="#1144AA" font-weight="700">COLD BLOB</text>
  <text x="430" y="320" text-anchor="middle" font-size="10" fill="#2255AA">~1,000 km anomaly</text>
  <text x="430" y="336" text-anchor="middle" font-size="10" fill="#2255AA">Sea surface temp: -2°C</text>

  <!-- Greenland label -->
  <rect x="310" y="120" width="120" height="30" fill="#F0F0F0" stroke="#999" stroke-width="1"/>
  <text x="370" y="140" text-anchor="middle" font-size="12" fill="#333" font-weight="600">GREENLAND</text>
  <!-- leader line from Greenland to cold blob -->
  <line x1="370" y1="150" x2="400" y2="235" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Iceland label -->
  <rect x="470" y="200" width="90" height="25" fill="#F0F0F0" stroke="#999" stroke-width="1"/>
  <text x="515" y="218" text-anchor="middle" font-size="11" fill="#333" font-weight="600">ICELAND</text>

  <!-- AMOC deep water sinking region -->
  <ellipse cx="460" cy="280" rx="30" ry="22" fill="none" stroke="#003399" stroke-width="2"/>
  <text x="510" y="265" font-size="9" fill="#003399" font-weight="700">↓ SINKING</text>
  <text x="510" y="278" font-size="9" fill="#003399">Deep water forms here</text>
  <text x="510" y="291" font-size="9" fill="#003399">Depth: 2,000–4,000m</text>
  <line x1="507" y1="272" x2="493" y2="278" stroke="#003399" stroke-width="1"/>

  <!-- Gulf Stream - warm surface current flowing north -->
  <!-- From Florida northward -->
  <path d="M 620 820 C 600 720 570 650 530 580 C 500 520 480 460 460 390 C 445 340 440 310 420 280" 
        fill="none" stroke="#CC3300" stroke-width="4.5" stroke-dasharray="none" opacity="0.7"/>
  <!-- Arrow head for Gulf Stream -->
  <polygon points="415,265 428,288 408,285" fill="#CC3300" opacity="0.7"/>

  <!-- Gulf Stream label with leader line -->
  <rect x="640" y="590" width="130" height="40" fill="#FFF8F5" stroke="#CC3300" stroke-width="1.5" rx="2"/>
  <text x="705" y="608" text-anchor="middle" font-size="11" fill="#CC3300" font-weight="700">GULF STREAM</text>
  <text x="705" y="622" text-anchor="middle" font-size="9" fill="#AA2200">Warm surface current →N</text>
  <line x1="640" y1="610" x2="595" y2="615" stroke="#CC3300" stroke-width="1.5"/>

  <!-- Deep return current - flowing south at depth (dashed) -->
  <path d="M 400 290 C 390 380 380 460 375 540 C 370 620 380 700 400 770 C 420 830 460 870 530 890"
        fill="none" stroke="#003399" stroke-width="3" stroke-dasharray="12,6" opacity="0.6"/>
  <!-- Arrow for return current -->
  <polygon points="535,905 520,882 540,882" fill="#003399" opacity="0.6"/>

  <!-- NADW label -->
  <rect x="180" y="560" width="175" height="44" fill="#F0F5FF" stroke="#003399" stroke-width="1.5" rx="2"/>
  <text x="267" y="578" text-anchor="middle" font-size="11" fill="#003399" font-weight="700">N. ATLANTIC DEEP WATER</text>
  <text x="267" y="592" text-anchor="middle" font-size="9" fill="#004499">Cold saline return flow ↓S</text>
  <text x="267" y="604" text-anchor="middle" font-size="9" fill="#004499">Depth: 1,500–3,500m</text>
  <line x1="355" y1="582" x2="390" y2="565" stroke="#003399" stroke-width="1.5"/>

  <!-- US East Coast label -->
  <text x="680" y="760" font-size="12" fill="#444" font-weight="600">US EAST COAST</text>
  <line x1="680" y1="765" x2="650" y2="800" stroke="#666" stroke-width="1"/>

  <!-- Europe label -->
  <text x="780" y="380" font-size="12" fill="#444" font-weight="600">EUROPE</text>

  <!-- Scale bar -->
  <line x1="700" y1="970" x2="900" y2="970" stroke="#333" stroke-width="2"/>
  <line x1="700" y1="963" x2="700" y2="977" stroke="#333" stroke-width="2"/>
  <line x1="900" y1="963" x2="900" y2="977" stroke="#333" stroke-width="2"/>
  <line x1="800" y1="966" x2="800" y2="977" stroke="#333" stroke-width="1"/>
  <text x="800" y="992" text-anchor="middle" font-size="11" fill="#333">1,000 km</text>

  <!-- Cross-section inset box -->
  <rect x="690" y="120" width="350" height="200" fill="#FAFAFA" stroke="#333" stroke-width="2" rx="3"/>
  <text x="865" y="145" text-anchor="middle" font-size="12" fill="#111" font-weight="700">CROSS-SECTION: AMOC</text>
  <!-- Surface layer (warm) -->
  <rect x="710" y="155" width="310" height="50" fill="#FFE8E0" stroke="#CC3300" stroke-width="1.5"/>
  <text x="865" y="178" text-anchor="middle" font-size="10" fill="#CC3300" font-weight="600">WARM SURFACE LAYER (0–800m)</text>
  <text x="865" y="192" text-anchor="middle" font-size="9" fill="#AA2200">Temp: 8–25°C · Flows northward →</text>
  <!-- Deep cold layer -->
  <rect x="710" y="205" width="310" height="95" fill="#D0E8FF" stroke="#003399" stroke-width="1.5"/>
  <text x="865" y="230" text-anchor="middle" font-size="10" fill="#003399" font-weight="600">COLD DEEP RETURN FLOW (800–4,000m)</text>
  <text x="865" y="246" text-anchor="middle" font-size="9" fill="#003399">Temp: 2–4°C · Flows southward ←</text>
  <text x="865" y="262" text-anchor="middle" font-size="9" fill="#003399">North Atlantic Deep Water (NADW)</text>
  <text x="865" y="278" text-anchor="middle" font-size="9" fill="#0055AA">Density: high salinity drives sinking</text>
  <!-- Depth markers -->
  <text x="712" y="170" font-size="8" fill="#999">0m</text>
  <text x="712" y="208" font-size="8" fill="#999">800m</text>
  <text x="712" y="298" font-size="8" fill="#999">4,000m</text>

  <!-- Temperature anomaly scale bar -->
  <rect x="690" y="345" width="350" height="60" fill="#FAFAFA" stroke="#555" stroke-width="1.5" rx="2"/>
  <text x="865" y="363" text-anchor="middle" font-size="10" fill="#333" font-weight="700">SEA SURFACE TEMP ANOMALY</text>
  <!-- Color scale bar -->
  <defs>
    <linearGradient id="tempGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0033AA"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#CC2200"/>
    </linearGradient>
  </defs>
  <rect x="710" y="370" width="310" height="18" fill="url(#tempGrad)" stroke="#999" stroke-width="1"/>
  <text x="712" y="402" font-size="9" fill="#333">−3°C</text>
  <text x="855" y="402" text-anchor="middle" font-size="9" fill="#333">0°C</text>
  <text x="1015" y="402" text-anchor="end" font-size="9" fill="#333">+3°C</text>
  <line x1="820" y1="370" x2="820" y2="388" stroke="#666" stroke-width="1"/>

  <!-- AMOC main label with box -->
  <rect x="242" y="420" width="90" height="30" fill="#FFFDE0" stroke="#886600" stroke-width="2" rx="2"/>
  <text x="287" y="440" text-anchor="middle" font-size="13" fill="#664400" font-weight="700">AMOC</text>
  <line x1="290" y1="450" x2="420" y2="480" stroke="#886600" stroke-width="1.5"/>

  <!-- Warning annotation -->
  <rect x="30" y="940" width="330" height="100" fill="#FFF8E0" stroke="#AA6600" stroke-width="2" rx="3"/>
  <text x="45" y="962" font-size="12" fill="#884400" font-weight="700">⚠ CLIMATE WARNING — June 2026</text>
  <text x="45" y="980" font-size="10" fill="#555">A "cold blob" south of Greenland may signal</text>
  <text x="45" y="996" font-size="10" fill="#555">AMOC weakening. Collapse would shift European</text>
  <text x="45" y="1012" font-size="10" fill="#555">temperatures by −5 to −10°C over decades.</text>
  <text x="45" y="1028" font-size="10" fill="#AA2200" font-weight="600">AMOC has weakened ~15% since mid-20th century.</text>

  <!-- Flow direction annotation -->
  <text x="540" y="500" text-anchor="middle" font-size="10" fill="#666" font-style="italic">Circulation transports ~20 million m³/sec</text>
  <text x="540" y="516" text-anchor="middle" font-size="10" fill="#666" font-style="italic">— equivalent to 100 Amazon Rivers</text>

  <!-- Measurements callout -->
  <rect x="750" y="700" width="290" height="80" fill="#FAFAFA" stroke="#555" stroke-width="1.5" rx="2"/>
  <text x="895" y="720" text-anchor="middle" font-size="10" fill="#333" font-weight="700">MEASUREMENTS</text>
  <text x="762" y="738" font-size="9" fill="#333">Flow rate: ~17 Sverdrups (Sv)</text>
  <text x="762" y="752" font-size="9" fill="#333">Max depth: ~4,000m (Nordic Seas)</text>
  <text x="762" y="766" font-size="9" fill="#333">Surface temp difference: up to 10°C</text>
  <text x="762" y="780" font-size="9" fill="#333">Cold blob area: ~800,000 km²</text>

  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>

  <!-- Bottom source line -->
  <text x="540" y="1068" text-anchor="middle" font-size="10" fill="#AAAAAA">Source: Wikipedia / NOAA / CNN Climate · AI Editorial Illustration · twong6531.github.io/citation-site</text>

</svg>
