<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg" font-family="'Helvetica Neue', Arial, sans-serif">
  <rect width="1080" height="1080" fill="#FFFFFF"/>

  <!-- Title box -->
  <rect x="30" y="30" width="480" height="60" fill="none" stroke="#111" stroke-width="2.5" rx="2"/>
  <text x="270" y="58" text-anchor="middle" font-size="15" fill="#111" font-weight="700" letter-spacing="1">FACIAL RECOGNITION CHECKPOINT</text>
  <text x="270" y="78" text-anchor="middle" font-size="11" fill="#555">Technical Editorial Illustration &#183; June 23, 2026</text>

  <!-- Site outline -->
  <rect x="60" y="140" width="960" height="800" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="6,4"/>

  <text x="540" y="170" text-anchor="middle" font-size="11" fill="#111" font-weight="700">STADIUM ENTRY TURNSTILE &#183; BIOMETRIC SCAN ZONE</text>

  <!-- Gooseneck mounting arm -->
  <path d="M540 220 C 480 220, 460 250, 460 300" fill="none" stroke="#222" stroke-width="4"/>
  <text x="380" y="230" font-size="9" fill="#222" font-weight="700">STEEL GOOSENECK ARM</text>
  <line x1="470" y1="240" x2="430" y2="232" stroke="#222" stroke-width="1"/>

  <!-- Camera dome -->
  <circle cx="460" cy="330" r="42" fill="none" stroke="#111" stroke-width="3"/>
  <circle cx="460" cy="330" r="22" fill="#F2F2F0" stroke="#222" stroke-width="2"/>
  <circle cx="460" cy="330" r="9" fill="none" stroke="#111" stroke-width="2"/>
  <text x="540" y="310" font-size="9" fill="#222" font-weight="700">WEATHERPROOF DOME HOUSING</text>
  <line x1="500" y1="312" x2="503" y2="318" stroke="#222" stroke-width="1"/>

  <!-- IR illuminator ring -->
  <circle cx="460" cy="330" r="35" fill="none" stroke="#666" stroke-width="1.5" stroke-dasharray="2,3"/>
  <text x="540" y="345" font-size="9" fill="#222" font-weight="700">IR ILLUMINATOR RING</text>
  <line x1="500" y1="340" x2="494" y2="335" stroke="#222" stroke-width="1"/>

  <!-- PCB lens module callout -->
  <text x="540" y="375" font-size="9" fill="#222" font-weight="700">PCB-MOUNTED LENS MODULE</text>
  <line x1="500" y1="372" x2="469" y2="332" stroke="#222" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Scan beam / FOV cone -->
  <path d="M460 372 L 380 520 L 540 520 Z" fill="#F7F7F5" stroke="#999" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="460" y="500" text-anchor="middle" font-size="9" fill="#666">FIELD OF VIEW &#183; FACE SCAN CONE</text>

  <!-- Network cable down the post -->
  <line x1="460" y1="372" x2="460" y2="600" stroke="#222" stroke-width="2"/>
  <text x="500" y="460" font-size="9" fill="#222" font-weight="700">NETWORK CABLE</text>
  <line x1="495" y1="455" x2="463" y2="440" stroke="#222" stroke-width="1"/>

  <!-- Wall-mounted access controller -->
  <rect x="420" y="600" width="80" height="50" fill="#F2F2F0" stroke="#222" stroke-width="2"/>
  <text x="460" y="666" text-anchor="middle" font-size="9" fill="#222" font-weight="700">ACCESS CONTROLLER</text>
  <text x="460" y="678" text-anchor="middle" font-size="8" fill="#666">matches feed vs. watchlist db</text>

  <!-- Turnstile -->
  <g fill="none" stroke="#222" stroke-width="2.5">
    <rect x="380" y="700" width="40" height="220" rx="6"/>
    <rect x="500" y="700" width="40" height="220" rx="6"/>
    <line x1="420" y1="780" x2="500" y2="780"/>
    <line x1="420" y1="830" x2="500" y2="830"/>
    <line x1="420" y1="880" x2="500" y2="880"/>
  </g>
  <text x="460" y="950" text-anchor="middle" font-size="10" fill="#111" font-weight="700">CHROME TURNSTILE</text>
  <text x="460" y="964" text-anchor="middle" font-size="8" fill="#666">subway-style entry barrier</text>

  <!-- Arrow showing data flow -->
  <path d="M540 330 C 700 330, 820 350, 860 420" fill="none" stroke="#444" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#444"/>
    </marker>
  </defs>
  <text x="780" y="400" font-size="9" fill="#444" font-weight="700">FEED ROUTED TO</text>
  <rect x="780" y="410" width="220" height="120" fill="#F7F7F5" stroke="#333" stroke-width="2" stroke-dasharray="2,2"/>
  <text x="890" y="440" text-anchor="middle" font-size="9" fill="#222" font-weight="700">WATCHLIST DATABASE</text>
  <text x="890" y="455" text-anchor="middle" font-size="8" fill="#666">named individuals flagged</text>
  <text x="890" y="470" text-anchor="middle" font-size="8" fill="#666">match &#8594; alert &#8594; deny entry</text>
  <line x1="800" y1="490" x2="980" y2="490" stroke="#999" stroke-width="1"/>
  <text x="890" y="510" text-anchor="middle" font-size="8" fill="#999">cross-referenced in real time</text>

  <!-- Scale marker -->
  <line x1="100" y1="900" x2="100" y2="960" stroke="#333" stroke-width="1.5"/>
  <line x1="92" y1="900" x2="108" y2="900" stroke="#333" stroke-width="1.5"/>
  <line x1="92" y1="960" x2="108" y2="960" stroke="#333" stroke-width="1.5"/>
  <text x="115" y="935" font-size="8" fill="#333">&#8776; 0.6 m</text>

  <!-- Footer note -->
  <text x="540" y="1040" text-anchor="middle" font-size="9" fill="#999">Rendered from public reporting on stadium biometric checkpoints &#183; not a depiction of any specific device model</text>
</svg>
