<text x="90" y="358" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" fill="#111111" font-weight="700">Zero-Waste Ocean Desalination Breakthrough</text>
<text x="90" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" fill="#555555">
<tspan x="90" y="378">University of Rochester researchers developed a desalination method that converts seawater</tspan>
<tspan x="90" y="394">to drinking water with zero brine waste. Traditional plants reject 50-60% of water as</tspan>
<tspan x="90" y="410">harmful concentrated saltwater discharged back into the ocean.</tspan>
</text>
<text x="90" y="434" font-family="Helvetica Neue, Arial, sans-serif" font-size="11" fill="#777777">• New method achieves near-100% water recovery vs. 40-50% for current plants</text>
<text x="90" y="449" font-family="Helvetica Neue, Arial, sans-serif" font-size="11" fill="#777777">• Brine discharge harms marine ecosystems in 150+ countries with coastal desalination</text>
<text x="90" y="464" font-family="Helvetica Neue, Arial, sans-serif" font-size="11" fill="#777777">• 2.2 billion people currently lack access to safe drinking water globally</text>
<rect x="90" y="488" width="300" height="2" fill="#EEEEEE"/>
