<text x="90" y="1118" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" fill="#111111" font-weight="700">Azure Linux Desktop Revealed at Build 2026</text>
<text x="90" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" fill="#555555">
<tspan x="90" y="1138">Microsoft unveiled Azure Linux Desktop at Build 2026, merging WSL, WinUI, and Azure cloud</tspan>
<tspan x="90" y="1154">tools into a seamless Linux experience on Windows. The announcement signals Microsoft's</tspan>
<tspan x="90" y="1170">deepening commitment to unifying developer workflows across platforms.</tspan>
</text>
<text x="90" y="1194" font-family="Helvetica Neue, Arial, sans-serif" font-size="11" fill="#777777">• Combines WSLc, WinUI Reactor, and Azure cloud services in one environment</text>
<text x="90" y="1209" font-family="Helvetica Neue, Arial, sans-serif" font-size="11" fill="#777777">• Linux powers 90%+ of cloud workloads; Windows hosts majority of developer PCs</text>
<text x="90" y="1224" font-family="Helvetica Neue, Arial, sans-serif" font-size="11" fill="#777777">• Microsoft Windows installed on 1B+ devices globally</text>
