<text x="90" y="928" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" fill="#111111" font-weight="700">How LLMs Work: Technical Explainer Goes Viral</text>
<text x="90" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" fill="#555555">
<tspan x="90" y="948">A deep-dive technical article on how large language models function attracted 591 upvotes on</tspan>
<tspan x="90" y="964">Hacker News, reflecting enormous public appetite for AI literacy. The piece covers</tspan>
<tspan x="90" y="980">tokenization, transformers, attention mechanisms, and inference in accessible terms.</tspan>
</text>
<text x="90" y="1004" font-family="Helvetica Neue, Arial, sans-serif" font-size="11" fill="#777777">• 591 upvotes on Hacker News within 24 hours of posting</text>
<text x="90" y="1019" font-family="Helvetica Neue, Arial, sans-serif" font-size="11" fill="#777777">• Transformers power all major AI: GPT-4, Claude, Gemini, and Llama</text>
<text x="90" y="1034" font-family="Helvetica Neue, Arial, sans-serif" font-size="11" fill="#777777">• Surveys show 78% of adults use AI tools but cannot explain how they function</text>
