<text x="90" y="738" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" fill="#111111" font-weight="700">Microsoft: We Are Free From OpenAI</text>
<text x="90" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" fill="#555555">
<tspan x="90" y="758">Microsoft's AI chief stated the company feels 'set free' from its OpenAI partnership to</tspan>
<tspan x="90" y="774">independently pursue superintelligence. This marks a strategic pivot emphasizing Microsoft's</tspan>
<tspan x="90" y="790">own frontier model research over dependence on OpenAI's GPT series.</tspan>
</text>
<text x="90" y="814" font-family="Helvetica Neue, Arial, sans-serif" font-size="11" fill="#777777">• Microsoft invested $13B+ in OpenAI across multiple rounds since 2019</text>
<text x="90" y="829" font-family="Helvetica Neue, Arial, sans-serif" font-size="11" fill="#777777">• Internal AI team now numbering thousands developing proprietary frontier models</text>
<text x="90" y="844" font-family="Helvetica Neue, Arial, sans-serif" font-size="11" fill="#777777">• Microsoft's Copilot revenue projected at $10B ARR by end of 2026</text>
