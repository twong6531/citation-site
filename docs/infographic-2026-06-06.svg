<text x="90" y="168" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" fill="#111111" font-weight="700">S&amp;P 500 Blocks SpaceX, OpenAI, Anthropic</text>
<text x="90" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" fill="#555555">
<tspan x="90" y="188">The S&amp;P 500 has refused to fast-track SpaceX's entry and confirmed it will also block OpenAI</tspan>
<tspan x="90" y="204">and Anthropic from rapid inclusion. The decision upholds profitability and public float</tspan>
<tspan x="90" y="220">requirements that these high-profile tech companies currently don't meet.</tspan>
</text>
<text x="90" y="244" font-family="Helvetica Neue, Arial, sans-serif" font-size="11" fill="#777777">• S&amp;P 500 requires 4 consecutive quarters of GAAP profitability</text>
<text x="90" y="259" font-family="Helvetica Neue, Arial, sans-serif" font-size="11" fill="#777777">• SpaceX valued at $350B+ but remains privately held and unprofitable on GAAP basis</text>
<text x="90" y="274" font-family="Helvetica Neue, Arial, sans-serif" font-size="11" fill="#777777">• OpenAI and Anthropic both private — trillions in index funds cannot invest</text>
