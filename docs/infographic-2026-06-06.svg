<text x="90" y="548" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" fill="#111111" font-weight="700">WWDC 2026: Gemini Powers Siri, iOS 27</text>
<text x="90" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" fill="#555555">
<tspan x="90" y="568">Apple's WWDC 2026 is set to reveal Siri upgraded with Google's Gemini AI, alongside iOS 27</tspan>
<tspan x="90" y="584">and macOS 27. The partnership signals Apple's strategy of integrating third-party AI models</tspan>
<tspan x="90" y="600">to compete with ChatGPT's assistant dominance.</tspan>
</text>
<text x="90" y="624" font-family="Helvetica Neue, Arial, sans-serif" font-size="11" fill="#777777">• Gemini-powered Siri extends Apple-Google AI deal announced in 2025</text>
<text x="90" y="639" font-family="Helvetica Neue, Arial, sans-serif" font-size="11" fill="#777777">• iOS 27 and macOS 27 expected on supported devices this fall</text>
<text x="90" y="654" font-family="Helvetica Neue, Arial, sans-serif" font-size="11" fill="#777777">• Apple Intelligence reached an estimated 2 billion active devices by end of 2025</text>
