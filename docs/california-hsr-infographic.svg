<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1800" width="800" height="1800" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">

  <!-- Background -->
  <rect width="800" height="1800" fill="#F7F7F5"/>

  <!-- Top rule -->
  <rect width="800" height="5" fill="#C0392B"/>

  <!-- HEADER -->
  <text x="56" y="60" font-size="10" letter-spacing="4" fill="#999" text-anchor="start" font-weight="400">INFRASTRUCTURE FAILURE REPORT — JUNE 2026</text>
  <text x="56" y="110" font-size="38" font-weight="900" fill="#1A1A1A" letter-spacing="-1">THE $231 BILLION</text>
  <text x="56" y="152" font-size="38" font-weight="900" fill="#C0392B" letter-spacing="-1">BROKEN PROMISE</text>
  <text x="56" y="188" font-size="14" fill="#666" font-weight="400">California High-Speed Rail: 18 years, $15B spent, zero track laid.</text>
  <line x1="56" y1="208" x2="744" y2="208" stroke="#DDD" stroke-width="1"/>

  <!-- SECTION: KEY NUMBERS -->
  <text x="56" y="240" font-size="9" letter-spacing="3" fill="#999" font-weight="600">KEY NUMBERS</text>

  <!-- Stat 1 -->
  <rect x="56" y="255" width="148" height="110" fill="#fff" stroke="#E8E8E8" stroke-width="1"/>
  <rect x="56" y="255" width="148" height="4" fill="#2C3E50"/>
  <text x="130" y="297" font-size="9" letter-spacing="2" fill="#999" text-anchor="middle">ORIGINAL BUDGET</text>
  <text x="130" y="326" font-size="28" font-weight="900" fill="#1A1A1A" text-anchor="middle">$33B</text>
  <text x="130" y="347" font-size="10" fill="#888" text-anchor="middle">Promised 2008</text>

  <!-- Stat 2 -->
  <rect x="214" y="255" width="148" height="110" fill="#fff" stroke="#E8E8E8" stroke-width="1"/>
  <rect x="214" y="255" width="148" height="4" fill="#C0392B"/>
  <text x="288" y="297" font-size="9" letter-spacing="2" fill="#C0392B" text-anchor="middle">CURRENT ESTIMATE</text>
  <text x="288" y="326" font-size="22" font-weight="900" fill="#C0392B" text-anchor="middle">$126–231B</text>
  <text x="288" y="347" font-size="10" fill="#888" text-anchor="middle">Up 283–600%</text>

  <!-- Stat 3 -->
  <rect x="372" y="255" width="148" height="110" fill="#fff" stroke="#E8E8E8" stroke-width="1"/>
  <rect x="372" y="255" width="148" height="4" fill="#E67E22"/>
  <text x="446" y="297" font-size="9" letter-spacing="2" fill="#E67E22" text-anchor="middle">SPENT SO FAR</text>
  <text x="446" y="326" font-size="28" font-weight="900" fill="#1A1A1A" text-anchor="middle">$15B</text>
  <text x="446" y="347" font-size="10" fill="#888" text-anchor="middle">Zero track laid</text>

  <!-- Stat 4 -->
  <rect x="530" y="255" width="100" height="110" fill="#fff" stroke="#E8E8E8" stroke-width="1"/>
  <rect x="530" y="255" width="100" height="4" fill="#8E44AD"/>
  <text x="580" y="297" font-size="9" letter-spacing="1" fill="#8E44AD" text-anchor="middle">FUNDING GAP</text>
  <text x="580" y="326" font-size="22" font-weight="900" fill="#1A1A1A" text-anchor="middle">$86.8B</text>
  <text x="580" y="347" font-size="10" fill="#888" text-anchor="middle">No plan to close</text>

  <!-- Stat 5 -->
  <rect x="640" y="255" width="104" height="110" fill="#fff" stroke="#E8E8E8" stroke-width="1"/>
  <rect x="640" y="255" width="104" height="4" fill="#7F8C8D"/>
  <text x="692" y="297" font-size="9" letter-spacing="1" fill="#7F8C8D" text-anchor="middle">FED GRANTS LOST</text>
  <text x="692" y="326" font-size="28" font-weight="900" fill="#1A1A1A" text-anchor="middle">$4B</text>
  <text x="692" y="347" font-size="10" fill="#888" text-anchor="middle">9 violations</text>

  <line x1="56" y1="385" x2="744" y2="385" stroke="#DDD" stroke-width="1"/>

  <!-- SECTION: TIMELINE -->
  <text x="56" y="412" font-size="9" letter-spacing="3" fill="#999" font-weight="600">TIMELINE OF FAILURE</text>

  <!-- Timeline line -->
  <line x1="160" y1="425" x2="160" y2="870" stroke="#DDD" stroke-width="1"/>

  <!-- 2008 -->
  <text x="148" y="448" font-size="12" font-weight="700" fill="#555" text-anchor="end">2008</text>
  <circle cx="160" cy="444" r="5" fill="#7F8C8D"/>
  <text x="174" y="440" font-size="13" font-weight="700" fill="#1A1A1A">Voters approve Prop 1A</text>
  <text x="174" y="458" font-size="11" fill="#888">$33B promised. Done by 2020. SF to LA in 2h40m.</text>

  <!-- 2020 -->
  <text x="148" y="510" font-size="12" font-weight="700" fill="#C0392B" text-anchor="end">2020</text>
  <circle cx="160" cy="506" r="6" fill="#C0392B"/>
  <text x="174" y="502" font-size="13" font-weight="700" fill="#C0392B">Original completion — MISSED</text>
  <text x="174" y="520" font-size="11" fill="#888">Zero miles of service. No trainset ordered. Date quietly erased.</text>

  <!-- Jul 2025 -->
  <text x="148" y="572" font-size="12" font-weight="700" fill="#C0392B" text-anchor="end">Jul 2025</text>
  <circle cx="160" cy="568" r="6" fill="#C0392B"/>
  <text x="174" y="564" font-size="13" font-weight="700" fill="#C0392B">Federal pulls $4B in grants</text>
  <text x="174" y="582" font-size="11" fill="#888">FRA: 9 compliance failures. $15B spent, no HS infrastructure.</text>

  <!-- Mar 2026 -->
  <text x="148" y="634" font-size="12" font-weight="700" fill="#E67E22" text-anchor="end">Mar 2026</text>
  <circle cx="160" cy="630" r="6" fill="#E67E22"/>
  <text x="174" y="626" font-size="13" font-weight="700" fill="#E67E22">Oversight chair: "dead end"</text>
  <text x="174" y="644" font-size="11" fill="#888">Lou Thompson writes to legislature. Cost hits $126–231B.</text>

  <!-- 2033 -->
  <text x="148" y="700" font-size="12" font-weight="700" fill="#7F8C8D" text-anchor="end">2033</text>
  <circle cx="160" cy="696" r="5" fill="#7F8C8D" stroke="#BBB" stroke-width="1"/>
  <text x="174" y="692" font-size="13" font-weight="700" fill="#555">Merced–Bakersfield only</text>
  <text x="174" y="710" font-size="11" fill="#888">SF–LA vision abandoned. "Train to nowhere" in Central Valley.</text>

  <!-- 2040 -->
  <text x="148" y="762" font-size="12" font-weight="700" fill="#7F8C8D" text-anchor="end">~2040</text>
  <circle cx="160" cy="758" r="5" fill="none" stroke="#BBB" stroke-width="2"/>
  <text x="174" y="754" font-size="13" font-weight="700" fill="#555">Full Phase I — if funded</text>
  <text x="174" y="772" font-size="11" fill="#888">No credible path to close $86.8B gap identified.</text>

  <line x1="56" y1="800" x2="744" y2="800" stroke="#DDD" stroke-width="1"/>

  <!-- SECTION: FAILURE MODES -->
  <text x="56" y="828" font-size="9" letter-spacing="3" fill="#999" font-weight="600">HOW IT FAILED</text>

  <!-- Failure 1 -->
  <rect x="56" y="843" width="5" height="90" fill="#C0392B"/>
  <text x="70" y="862" font-size="9" letter-spacing="2" fill="#C0392B">CRITICAL</text>
  <text x="70" y="882" font-size="15" font-weight="800" fill="#1A1A1A">Cost Explosion</text>
  <text x="70" y="900" font-size="11" fill="#666">$33B → $126B minimum. Up to $231B full build. A 600% overrun</text>
  <text x="70" y="916" font-size="11" fill="#666">on a cost estimate voters never had reason to doubt.</text>
  <line x1="56" y1="942" x2="744" y2="942" stroke="#EEE" stroke-width="1"/>

  <!-- Failure 2 -->
  <rect x="56" y="952" width="5" height="90" fill="#C0392B"/>
  <text x="70" y="971" font-size="9" letter-spacing="2" fill="#C0392B">CRITICAL</text>
  <text x="70" y="991" font-size="15" font-weight="800" fill="#1A1A1A">Federal Noncompliance</text>
  <text x="70" y="1009" font-size="11" fill="#666">9 violations cited. $4B terminated. No trainset vendor after</text>
  <text x="70" y="1025" font-size="11" fill="#666">16 years. $7B shortfall just for the Initial Operating Segment.</text>
  <line x1="56" y1="1051" x2="744" y2="1051" stroke="#EEE" stroke-width="1"/>

  <!-- Failure 3 -->
  <rect x="56" y="1061" width="5" height="90" fill="#E67E22"/>
  <text x="70" y="1080" font-size="9" letter-spacing="2" fill="#E67E22">HIGH SEVERITY</text>
  <text x="70" y="1100" font-size="15" font-weight="800" fill="#1A1A1A">Scope Collapse</text>
  <text x="70" y="1118" font-size="11" fill="#666">SF–LA vision abandoned. Merced to Bakersfield: a low-ridership</text>
  <text x="70" y="1134" font-size="11" fill="#666">corridor connecting mid-size inland cities — not a revolution.</text>
  <line x1="56" y1="1160" x2="744" y2="1160" stroke="#EEE" stroke-width="1"/>

  <!-- Failure 4 -->
  <rect x="56" y="1170" width="5" height="90" fill="#E67E22"/>
  <text x="70" y="1189" font-size="9" letter-spacing="2" fill="#E67E22">HIGH SEVERITY</text>
  <text x="70" y="1209" font-size="15" font-weight="800" fill="#1A1A1A">Institutional Breakdown</text>
  <text x="70" y="1227" font-size="11" fill="#666">No vendor. No timeline. Ex-oversight chair says "dead end."</text>
  <text x="70" y="1243" font-size="11" fill="#666">Authority spends $1B+/year regardless with no deliverable in sight.</text>

  <line x1="56" y1="1275" x2="744" y2="1275" stroke="#DDD" stroke-width="1"/>

  <!-- PULL QUOTE BLOCK -->
  <rect x="56" y="1295" width="688" height="140" fill="#C0392B"/>
  <text x="400" y="1350" font-size="22" font-weight="900" fill="#fff" text-anchor="middle">"$15 billion spent.</text>
  <text x="400" y="1382" font-size="22" font-weight="900" fill="#fff" text-anchor="middle">Zero miles of high-speed track."</text>
  <text x="400" y="1415" font-size="10" letter-spacing="3" fill="rgba(255,255,255,0.65)" text-anchor="middle">FEDERAL RAILROAD ADMINISTRATION — 2025</text>

  <line x1="56" y1="1455" x2="744" y2="1455" stroke="#DDD" stroke-width="1"/>

  <!-- VERDICT -->
  <text x="56" y="1480" font-size="9" letter-spacing="3" fill="#999" font-weight="600">VERDICT</text>
  <text x="56" y="1510" font-size="13" fill="#444">Eighteen years after California voters approved it, the high-speed</text>
  <text x="56" y="1530" font-size="13" fill="#444">rail project has spent $15 billion and built nothing. Cost estimates</text>
  <text x="56" y="1550" font-size="13" fill="#444">grew 600%. Federal funding was pulled for noncompliance. The</text>
  <text x="56" y="1570" font-size="13" fill="#444">transformative SF–LA vision is now a Central Valley segment</text>
  <text x="56" y="1590" font-size="13" fill="#444">that won't open until 2033. The question is no longer whether</text>
  <text x="56" y="1610" font-size="13" fill="#444">it will be built on time — but whether it will be built at all.</text>

  <!-- LEGEND -->
  <circle cx="56" cy="1660" r="6" fill="#C0392B"/>
  <text x="70" y="1665" font-size="10" fill="#888">Critical failure</text>
  <circle cx="175" cy="1660" r="6" fill="#E67E22"/>
  <text x="189" y="1665" font-size="10" fill="#888">High severity</text>
  <circle cx="285" cy="1660" r="5" fill="#7F8C8D"/>
  <text x="299" y="1665" font-size="10" fill="#888">Planned / uncertain</text>

  <!-- FOOTER -->
  <line x1="0" y1="1695" x2="800" y2="1695" stroke="#DDD" stroke-width="1"/>
  <text x="56" y="1720" font-size="10" fill="#AAA">Sources: FRA, CAHSRA 2026 Business Plan, CA Policy Center, Newsweek</text>
  <text x="744" y="1720" font-size="10" fill="#AAA" text-anchor="end">twong6531.github.io/citation-site</text>
  <rect x="0" y="1795" width="800" height="5" fill="#C0392B"/>

</svg>
