  <text x="98" y="695" font-size="9" fill="#FFFFFF" text-anchor="middle" font-weight="700">TECH</text>
  <text x="80" y="721" font-size="16" fill="#111111" font-weight="700">Open-Source Radio Sees WiFi Through Walls</text>
  <text x="80" y="741" font-size="12" fill="#555555">QuadRF, built on Raspberry Pi 5 + FPGA with picosecond timing, performs phased-array</text>
  <text x="80" y="757" font-size="12" fill="#555555">beamforming to detect drones and decode WiFi signals through solid walls.</text>
  <text x="80" y="778" font-size="11" fill="#777777">• Achieves up to 1.15 MW EIRP when chained as a Moon-scale antenna array</text>
  <text x="80" y="794" font-size="11" fill="#777777">• Built by former SpaceX Starlink engineer Martin McCormick as open hardware</text>
  <text x="80" y="810" font-size="11" fill="#777777">• Can stream and decode WiFi RF traffic from outside a building in real time</text>
