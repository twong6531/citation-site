  <text x="80" y="1085" font-size="16" fill="#111111" font-weight="700">Best Software Tools Vanish Into the Workflow</text>
  <text x="80" y="1105" font-size="12" fill="#555555">A widely-read essay argues effective tools become transparent extensions of thought,</text>
  <text x="80" y="1121" font-size="12" fill="#555555">challenging the industry's habit of adding visible features as a proxy for value.</text>
  <text x="80" y="1142" font-size="11" fill="#777777">• Essay gained 332 upvotes on Hacker News within 12 hours of posting</text>
  <text x="80" y="1158" font-size="11" fill="#777777">• Argues cognitive load reduction is the primary metric of tool quality</text>
  <text x="80" y="1174" font-size="11" fill="#777777">• Cites Unix pipes, Vim, and APL as examples of tools that become invisible</text>
