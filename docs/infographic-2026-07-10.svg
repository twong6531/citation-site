  <!-- STORY 5: Einstein Relativity Chemistry -->
  <text x="48" y="878" font-size="11" fill="#888888" font-weight="600">05</text>
  <rect x="80" y="864" width="60" height="18" rx="3" fill="#0077CC"/>
  <text x="110" y="877" font-size="9" fill="#FFFFFF" text-anchor="middle" font-weight="700">SCIENCE</text>
  <text x="80" y="903" font-size="16" fill="#111111" font-weight="700">Relativity Shapes Gold and Mercury Chemistry</text>
  <text x="80" y="923" font-size="12" fill="#555555">Brown University researchers confirmed that Einstein's special relativity governs</text>
  <text x="80" y="939" font-size="12" fill="#555555">chemical bonding in heavy elements — explaining gold's color and mercury's liquidity.</text>
  <text x="80" y="960" font-size="11" fill="#777777">• Relativistic orbital contraction is measurable in elements with atomic number &gt;70</text>
  <text x="80" y="976" font-size="11" fill="#777777">• Gold's 6s orbital contracts by ~10% due to relativistic effects — causing yellow color</text>
  <text x="80" y="992" font-size="11" fill="#777777">• Mercury's relativistic 6s contraction explains why it's liquid at room temperature (234K)</text>
