  <text x="114" y="331" font-size="9" fill="#FFFFFF" text-anchor="middle" font-weight="700">BUSINESS</text>
  <text x="80" y="357" font-size="16" fill="#111111" font-weight="700">Apple Sues OpenAI for AI Trade Secrets</text>
  <text x="80" y="377" font-size="12" fill="#555555">Apple filed a lawsuit alleging former employees carried proprietary Siri and on-device</text>
  <text x="80" y="393" font-size="12" fill="#555555">AI technology to OpenAI — a landmark IP dispute between Big Tech rivals.</text>
  <text x="80" y="414" font-size="11" fill="#777777">• Lawsuit involves multiple ex-Apple engineers hired by OpenAI in 2025–2026</text>
  <text x="80" y="430" font-size="11" fill="#777777">• Stolen tech allegedly covers Siri neural architecture and on-device inference</text>
  <text x="80" y="446" font-size="11" fill="#777777">• Filed in federal court July 10, 2026 — OpenAI disputes all allegations</text>
