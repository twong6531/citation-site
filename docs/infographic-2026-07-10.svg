  <text x="114" y="513" font-size="9" fill="#FFFFFF" text-anchor="middle" font-weight="700">BUSINESS</text>
  <text x="80" y="539" font-size="16" fill="#111111" font-weight="700">NYC Outlaws Dark Pattern Subscription Tricks</text>
  <text x="80" y="559" font-size="12" fill="#555555">New York City passes legislation banning deceptive auto-renewal and cancellation</text>
  <text x="80" y="575" font-size="12" fill="#555555">barriers — the largest US city to target subscription dark patterns by law.</text>
  <text x="80" y="596" font-size="11" fill="#777777">• NYC is home to 8.3 million residents affected by deceptive subscription UX</text>
  <text x="80" y="612" font-size="11" fill="#777777">• Dark patterns cost US consumers an estimated $10B+ in unwanted renewals/year</text>
  <text x="80" y="628" font-size="11" fill="#777777">• Law requires 1-click cancellation and 30-day cancellation window for all services</text>
