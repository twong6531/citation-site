  <!-- STORY 1: AI Math Proof -->
  <text x="48" y="150" font-size="11" fill="#888888" font-weight="600">01</text>
  <rect x="80" y="136" width="44" height="18" rx="3" fill="#6C47FF"/>
  <text x="102" y="149" font-size="9" fill="#FFFFFF" text-anchor="middle" font-weight="700">AI</text>
  <text x="80" y="175" font-size="16" fill="#111111" font-weight="700" textLength="620" lengthAdjust="spacing">AI Solves Decades-Old Graph Theory Problem</text>
  <text x="80" y="195" font-size="12" fill="#555555">OpenAI's GPT-5.6 Sol Ultra produced a formal proof of the Cycle Double Cover</text>
  <text x="80" y="211" font-size="12" fill="#555555">Conjecture, a problem unsolved since the 1970s. AI now advances pure mathematics.</text>
  <text x="80" y="232" font-size="11" fill="#777777">• GPT-5.6 Sol Ultra is OpenAI's most advanced reasoning model as of mid-2026</text>
  <text x="80" y="248" font-size="11" fill="#777777">• Cycle Double Cover: every 2-edge-connected graph has a cycle double cover</text>
  <text x="80" y="264" font-size="11" fill="#777777">• Proof published as verified PDF — 1st AI-authored conjecture proof in graph theory</text>
  <!-- Impact bar -->
