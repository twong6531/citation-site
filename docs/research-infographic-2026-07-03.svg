  <rect x="160" y="937" width="480" height="12" fill="#2D8A4E" rx="2"/>
  <text x="648" y="948" fill="#111111" font-size="9" font-weight="700">HIGH</text>

  <text x="40" y="966" fill="#555555" font-size="9">GPS Bias</text>
