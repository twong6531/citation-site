  <text x="648" y="822" fill="#111111" font-size="9" font-weight="700">HIGH</text>

  <text x="40" y="840" fill="#555555" font-size="9">DST-TransitNet</text>
  <rect x="160" y="829" width="480" height="12" fill="#2D8A4E" rx="2"/>
  <text x="648" y="840" fill="#111111" font-size="9" font-weight="700">HIGH</text>

  <text x="40" y="858" fill="#555555" font-size="9">Sidewalk Robots</text>
  <rect x="160" y="847" width="480" height="12" fill="#2D8A4E" rx="2"/>
  <text x="648" y="858" fill="#111111" font-size="9" font-weight="700">HIGH</text>

  <text x="40" y="876" fill="#555555" font-size="9">Subway Incident</text>
  <rect x="160" y="865" width="480" height="12" fill="#2D8A4E" rx="2"/>
  <text x="648" y="876" fill="#111111" font-size="9" font-weight="700">HIGH</text>

  <text x="40" y="894" fill="#555555" font-size="9">Elderly Mobility</text>
  <rect x="160" y="883" width="480" height="12" fill="#2D8A4E" rx="2"/>
  <text x="648" y="894" fill="#111111" font-size="9" font-weight="700">HIGH</text>

