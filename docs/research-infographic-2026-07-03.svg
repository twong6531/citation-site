  <rect x="160" y="991" width="480" height="12" fill="#2D8A4E" rx="2"/>
  <text x="648" y="1002" fill="#111111" font-size="9" font-weight="700">HIGH</text>

  <!-- Legend -->
  <rect x="160" y="1016" width="18" height="10" fill="#2D8A4E" rx="2"/>
  <text x="184" y="1025" fill="#555555" font-size="9">High confidence</text>
  <rect x="310" y="1016" width="18" height="10" fill="#E8A83A" rx="2"/>
  <text x="334" y="1025" fill="#555555" font-size="9">Medium confidence</text>

  <!-- ACTIONABLE TAKEAWAYS -->
  <text x="40" y="1068" fill="#111111" font-size="9" font-weight="700" letter-spacing="3">ACTIONABLE TAKEAWAYS</text>
  <line x1="40" y1="1076" x2="760" y2="1076" stroke="#111111" stroke-width="1.5"/>

  <rect x="40" y="1090" width="6" height="6" fill="#E84B3A"/>
  <text x="58" y="1100" fill="#111111" font-size="11">
    <tspan font-weight="700">Strip weather data</tspan>
    <tspan> from ridership models unless regularization is applied</tspan>
  </text>
  <rect x="40" y="1116" width="6" height="6" fill="#E84B3A"/>
  <text x="58" y="1126" fill="#111111" font-size="11">
    <tspan font-weight="700">Audit GPS datasets for demographic bias</tspan>
    <tspan> before use in equity-sensitive planning</tspan>
  </text>
  <rect x="40" y="1142" width="6" height="6" fill="#E84B3A"/>
  <text x="58" y="1152" fill="#111111" font-size="11">
    <tspan font-weight="700">Build elderly-specific ridership models</tspan>
    <tspan> — general models overestimate travel by 5–9%</tspan>
  </text>
  <rect x="40" y="1168" width="6" height="6" fill="#E84B3A"/>
  <text x="58" y="1178" fill="#111111" font-size="11">
    <tspan font-weight="700">Choose fare-free objective explicitly:</tspan>
    <tspan> equity vs. welfare produce different zone sizes</tspan>
  </text>
  <rect x="40" y="1194" width="6" height="6" fill="#E84B3A"/>
  <text x="58" y="1204" fill="#111111" font-size="11">
    <tspan font-weight="700">Deploy sidewalk robots as dual-purpose sensors</tspan>
    <tspan> — zero marginal cost walkability data</tspan>
  </text>

  <!-- PAPER COUNT STAT -->
  <rect x="40" y="1240" width="720" height="80" fill="#F0F0EE"/>
  <text x="100" y="1278" fill="#111111" font-size="48" font-weight="700" text-anchor="middle">12</text>
  <text x="100" y="1300" fill="#555555" font-size="10" text-anchor="middle">PAPERS</text>
  <text x="310" y="1278" fill="#E84B3A" font-size="48" font-weight="700" text-anchor="middle">83%</text>
  <text x="310" y="1300" fill="#555555" font-size="10" text-anchor="middle">HIGH CONFIDENCE</text>
  <text x="520" y="1278" fill="#2B6CB0" font-size="48" font-weight="700" text-anchor="middle">4</text>
  <text x="520" y="1300" fill="#555555" font-size="10" text-anchor="middle">EMERGING THEMES</text>
  <text x="700" y="1278" fill="#2D8A4E" font-size="48" font-weight="700" text-anchor="middle">5</text>
  <text x="700" y="1300" fill="#555555" font-size="10" text-anchor="middle">CONTRARIAN FINDINGS</text>

