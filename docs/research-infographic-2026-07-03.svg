<svg viewBox="0 0 800 1600" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect width="800" height="1600" fill="#F7F7F5"/>

  <!-- HEADER -->
  <rect x="0" y="0" width="800" height="120" fill="#111111"/>
  <text x="40" y="42" fill="#F7F7F5" font-size="11" font-weight="400" letter-spacing="3">TRANSIT RESEARCH DIGEST</text>
  <text x="40" y="75" fill="#FFFFFF" font-size="26" font-weight="700">JULY 3, 2026</text>
  <text x="40" y="102" fill="#888888" font-size="11" letter-spacing="1">12 PAPERS · ANALYSIS BY TRANSIT RESEARCH AGENT</text>
  <rect x="680" y="30" width="80" height="60" fill="#E84B3A"/>
  <text x="720" y="58" fill="#FFFFFF" font-size="10" font-weight="700" text-anchor="middle">AI +</text>
  <text x="720" y="72" fill="#FFFFFF" font-size="10" font-weight="700" text-anchor="middle">EQUITY</text>
  <text x="720" y="86" fill="#FFFFFF" font-size="9" text-anchor="middle">FOCUS</text>

  <!-- KEY FINDINGS -->
  <text x="40" y="158" fill="#111111" font-size="9" font-weight="700" letter-spacing="3">KEY FINDINGS</text>
  <line x1="40" y1="166" x2="760" y2="166" stroke="#111111" stroke-width="1.5"/>

  <!-- Finding 1 -->
  <rect x="40" y="178" width="36" height="36" fill="#111111"/>
  <text x="58" y="202" fill="#FFFFFF" font-size="20" font-weight="700" text-anchor="middle">1</text>
  <text x="92" y="193" fill="#111111" font-size="14" font-weight="700">
    <tspan>Weather data hurts transit prediction models</tspan>
  </text>
  <text x="92" y="210" fill="#555555" font-size="11">
    <tspan>MBTA benchmarking: adding weather features causes overfitting across</tspan>
  </text>
  <text x="92" y="224" fill="#555555" font-size="11">
    <tspan>all 10 tested models. Day-of-week and season dominate accuracy.</tspan>
  </text>

  <!-- Finding 2 -->
  <rect x="40" y="246" width="36" height="36" fill="#E84B3A"/>
  <text x="58" y="270" fill="#FFFFFF" font-size="20" font-weight="700" text-anchor="middle">2</text>
  <text x="92" y="261" fill="#111111" font-size="14" font-weight="700">
    <tspan>GPS mobility data is not a neutral planning resource</tspan>
  </text>
  <text x="92" y="278" fill="#555555" font-size="11">
    <tspan>Facebook vs. Veraset give systematically different population portraits.</tspan>
  </text>
  <text x="92" y="292" fill="#555555" font-size="11">
    <tspan>Veraset concentrates in wealthier areas — study of 2,478 Mexican municipalities.</tspan>
  </text>

  <!-- Finding 3 -->
  <rect x="40" y="314" width="36" height="36" fill="#2B6CB0"/>
  <text x="58" y="338" fill="#FFFFFF" font-size="20" font-weight="700" text-anchor="middle">3</text>
  <text x="92" y="329" fill="#111111" font-size="14" font-weight="700">
    <tspan>Equity and welfare optimization diverge on fare-free zones</tspan>
  </text>
  <text x="92" y="346" fill="#555555" font-size="11">
    <tspan>First analytical model shows equity goals push for larger zones and earlier</tspan>
  </text>
  <text x="92" y="360" fill="#555555" font-size="11">
    <tspan>activation than pure welfare maximization — different policy parameters required.</tspan>
  </text>

  <!-- PAPER OF THE DAY -->
  <rect x="0" y="396" width="800" height="4" fill="#E84B3A"/>
  <rect x="40" y="416" width="720" height="110" fill="#111111"/>
  <text x="60" y="441" fill="#E84B3A" font-size="9" font-weight="700" letter-spacing="3">PAPER OF THE DAY</text>
  <text x="60" y="462" fill="#FFFFFF" font-size="15" font-weight="700">
    <tspan>Leveraging Sidewalk Robots for Walkability Analyses</tspan>
  </text>
  <text x="60" y="479" fill="#AAAAAA" font-size="10">Tong, Simoni, Arfvidsson, Mårtensson · Computers, Environment and Urban Systems 2026</text>
  <text x="60" y="498" fill="#DDDDDD" font-size="11">
    <tspan>Sidewalk delivery robots serve as mobile walkability sensors: robot speed is a proxy</tspan>
  </text>
  <text x="60" y="513" fill="#DDDDDD" font-size="11">
    <tspan>for pedestrian comfort. 101 trips, 900 segments on Stockholm campus. Every delivery</tspan>
  </text>
  <text x="60" y="528" fill="#DDDDDD" font-size="11">
    <tspan>robot becomes an infrastructure data point — city-scale monitoring at zero marginal cost.</tspan>
  </text>

  <!-- EMERGING THEMES -->
  <text x="40" y="570" fill="#111111" font-size="9" font-weight="700" letter-spacing="3">EMERGING THEMES</text>
  <line x1="40" y1="578" x2="760" y2="578" stroke="#111111" stroke-width="1.5"/>

  <!-- Theme col 1 -->
  <rect x="40" y="592" width="210" height="3" fill="#E84B3A"/>
  <text x="40" y="610" fill="#111111" font-size="12" font-weight="700">AI-Powered</text>
  <text x="40" y="626" fill="#111111" font-size="12" font-weight="700">Prediction</text>
  <text x="40" y="648" fill="#555555" font-size="10">GNN, RNN, and LLM</text>
  <text x="40" y="662" fill="#555555" font-size="10">models achieve network-</text>
  <text x="40" y="676" fill="#555555" font-size="10">scale operational</text>
  <text x="40" y="690" fill="#555555" font-size="10">forecasting. DST-</text>
  <text x="40" y="704" fill="#555555" font-size="10">TransitNet, MBTA</text>
  <text x="40" y="718" fill="#555555" font-size="10">benchmark, incident</text>
  <text x="40" y="732" fill="#555555" font-size="10">causality models.</text>

  <!-- Theme col 2 -->
  <rect x="297" y="592" width="210" height="3" fill="#2B6CB0"/>
  <text x="297" y="610" fill="#111111" font-size="12" font-weight="700">Inclusive &amp;</text>
  <text x="297" y="626" fill="#111111" font-size="12" font-weight="700">Equity-Aware</text>
  <text x="297" y="648" fill="#555555" font-size="10">Elderly mobility modeling,</text>
  <text x="297" y="662" fill="#555555" font-size="10">GPS data bias exposure,</text>
  <text x="297" y="676" fill="#555555" font-size="10">fare-free zone equity</text>
  <text x="297" y="690" fill="#555555" font-size="10">optimization challenge</text>
  <text x="297" y="704" fill="#555555" font-size="10">majority-population</text>
  <text x="297" y="718" fill="#555555" font-size="10">planning defaults.</text>

  <!-- Theme col 3 -->
  <rect x="554" y="592" width="206" height="3" fill="#2D8A4E"/>
  <text x="554" y="610" fill="#111111" font-size="12" font-weight="700">Multimodal</text>
  <text x="554" y="626" fill="#111111" font-size="12" font-weight="700">Integration</text>
  <text x="554" y="648" fill="#555555" font-size="10">E-scooter hub causal AI,</text>
  <text x="554" y="662" fill="#555555" font-size="10">fly-by transit corridors,</text>
  <text x="554" y="676" fill="#555555" font-size="10">AMoD incentive design.</text>
  <text x="554" y="690" fill="#555555" font-size="10">Transit as backbone;</text>
  <text x="554" y="704" fill="#555555" font-size="10">edges radically diversified</text>
  <text x="554" y="718" fill="#555555" font-size="10">by new mobility modes.</text>

  <!-- CONFIDENCE CHART -->
  <text x="40" y="774" fill="#111111" font-size="9" font-weight="700" letter-spacing="3">CONFIDENCE BY PAPER</text>
  <line x1="40" y1="782" x2="760" y2="782" stroke="#111111" stroke-width="1.5"/>

