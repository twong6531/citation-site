  <rect x="0" y="1360" width="800" height="240" fill="#111111"/>
  <text x="40" y="1396" fill="#F7F7F5" font-size="13" font-weight="700">LONG-TERM IMPLICATIONS</text>
  <line x1="40" y1="1404" x2="760" y2="1404" stroke="#444444" stroke-width="1"/>
  <text x="40" y="1425" fill="#AAAAAA" font-size="10">
    <tspan>01 — AI-optimized transit networks could restructure service as dynamically priced, real-time coordinated</tspan>
  </text>
  <text x="40" y="1442" fill="#AAAAAA" font-size="10">
    <tspan>02 — Uncorrected GPS bias will institutionalize existing inequities if embedded in AI planning tools</tspan>
  </text>
  <text x="40" y="1459" fill="#AAAAAA" font-size="10">
    <tspan>03 — TOD success in car-centric cities (Gulf, SE Asia, LatAm) requires regulatory transformation, not design alone</tspan>
  </text>
  <text x="40" y="1476" fill="#AAAAAA" font-size="10">
    <tspan>04 — Causal AI paradigm will replace correlational ML in transit planning, improving city-to-city transferability</tspan>
  </text>

  <line x1="40" y1="1510" x2="760" y2="1510" stroke="#333333" stroke-width="1"/>
