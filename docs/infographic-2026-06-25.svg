<text x="40" y="960" font-size="16" font-weight="bold" fill="#111111">LastPass Discloses Another Data Breach</text>
<text x="40" y="982" font-size="12" fill="#666666">Password manager LastPass notified users of yet another data breach, continuing a troubled</text>
<text x="40" y="998" font-size="12" fill="#666666">security history for the company. The disclosure renewed scrutiny of how password managers</text>
<circle cx="44" cy="1000" r="2.5" fill="#00897B"/>
<text x="54" y="1004" font-size="11.5" fill="#444444">Reported by 9to5Mac on June 23, 2026</text>
