<text x="40" y="580" font-size="16" font-weight="bold" fill="#111111">Half-Life 2 Runs Entirely in a Browser</text>
<text x="40" y="602" font-size="12" fill="#666666">A developer ported the classic game Half-Life 2 to run fully in a web browser without plugins,</text>
<text x="40" y="618" font-size="12" fill="#666666">showcasing how far browser-based 3D rendering has advanced. The project drew massive engagement</text>
<circle cx="44" cy="620" r="2.5" fill="#00897B"/>
<text x="54" y="624" font-size="11.5" fill="#444444">Project hosted at hl2.slqnt.dev, no installation required</text>
<circle cx="44" cy="637" r="2.5" fill="#00897B"/>
<text x="54" y="641" font-size="11.5" fill="#444444">Drew 475 points on Hacker News within hours</text>
<circle cx="44" cy="654" r="2.5" fill="#00897B"/>
<text x="54" y="658" font-size="11.5" fill="#444444">Demonstrates modern WebGL/WebGPU performance for legacy game engines</text>
