<text x="40" y="770" font-size="16" font-weight="bold" fill="#111111">Cloudflare Opens Self-Managed OAuth to All</text>
<text x="40" y="792" font-size="12" fill="#666666">Cloudflare launched self-managed OAuth client creation for all customers, previously available</text>
<text x="40" y="808" font-size="12" fill="#666666">only to a small number of manually onboarded partners. The change lets developers build SaaS</text>
<circle cx="44" cy="810" r="2.5" fill="#00897B"/>
<text x="54" y="814" font-size="11.5" fill="#444444">Feature was previously limited to manually onboarded integrations only</text>
