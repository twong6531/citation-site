<text x="54" y="831" font-size="11.5" fill="#444444">Story drew 268 points on Hacker News</text>
<circle cx="44" cy="844" r="2.5" fill="#00897B"/>
<text x="54" y="848" font-size="11.5" fill="#444444">Cloudflare says it helps power roughly 20% of the web</text>
