<text x="54" y="451" font-size="11.5" fill="#444444">Story drew 624 points on Hacker News</text>
<circle cx="44" cy="464" r="2.5" fill="#6C47FF"/>
<text x="54" y="468" font-size="11.5" fill="#444444">Reuters reported the dispute on June 24, 2026</text>
