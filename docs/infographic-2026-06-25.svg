<text x="40" y="390" font-size="16" font-weight="bold" fill="#111111">Anthropic Accuses Alibaba of Extracting Claude</text>
<text x="40" y="412" font-size="12" fill="#666666">Anthropic alleges that Alibaba illicitly extracted capabilities from its Claude AI models,</text>
<text x="40" y="428" font-size="12" fill="#666666">raising fresh questions about model distillation and IP protection in frontier AI. The dispute</text>
<circle cx="44" cy="430" r="2.5" fill="#6C47FF"/>
<text x="54" y="434" font-size="11.5" fill="#444444">Anthropic publicly named Alibaba in the allegation</text>
