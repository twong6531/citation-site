<text x="40" y="200" font-size="16" font-weight="bold" fill="#111111">OpenAI Unveils First Custom AI Chip</text>
<text x="40" y="222" font-size="12" fill="#666666">OpenAI revealed its first custom-designed processor, codenamed Jalapeno, built in partnership</text>
<text x="40" y="238" font-size="12" fill="#666666">with Broadcom specifically to run inference for its AI models. The chip marks OpenAI&#x27;s entry</text>
<circle cx="44" cy="240" r="2.5" fill="#6C47FF"/>
<text x="54" y="244" font-size="11.5" fill="#444444">Chip is named Jalapeno and was co-designed with Broadcom</text>
<circle cx="44" cy="257" r="2.5" fill="#6C47FF"/>
<text x="54" y="261" font-size="11.5" fill="#444444">Designed specifically for inference, not training, workloads</text>
<circle cx="44" cy="274" r="2.5" fill="#6C47FF"/>
<text x="54" y="278" font-size="11.5" fill="#444444">Story drew 764 points on Hacker News, the day&#x27;s top story</text>
