<text x="40" y="1150" font-size="16" font-weight="bold" fill="#111111">Wikipedia UK Workers Seek Union Recognition</text>
<text x="40" y="1172" font-size="12" fill="#666666">Workers supporting Wikipedia operations in Britain are seeking formal union recognition, a</text>
<text x="40" y="1188" font-size="12" fill="#666666">global first for staff connected to the encyclopedia&#x27;s parent organization. The move could set</text>
<circle cx="44" cy="1190" r="2.5" fill="#E65100"/>
