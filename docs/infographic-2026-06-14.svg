  <text x="40" y="198" font-size="16" fill="#111111" font-weight="700">ZhipuAI Releases GLM 5.2 Frontier Model</text>
  <text x="40" y="218" font-size="12" fill="#555555">ZhipuAI released GLM 5.2, a new large language model surpassing multiple benchmarks.</text>
  <text x="40" y="234" font-size="12" fill="#555555">Chinese AI development continues at the frontier level, challenging US labs directly.</text>
  <text x="40" y="256" font-size="11" fill="#333333">→ 699 upvotes on Hacker News in first hours of release</text>
  <text x="40" y="272" font-size="11" fill="#333333">→ GLM 5.2 benchmarks beat Qwen3.7 and several competing models</text>
  <text x="40" y="288" font-size="11" fill="#333333">→ Rio de Janeiro's city AI model Rio3.5 also beats Qwen3.7 separately</text>

