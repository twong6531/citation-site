  <text x="40" y="538" font-size="16" fill="#111111" font-weight="700">Honda Civic Headunit Hacked via USB Key</text>
  <text x="40" y="558" font-size="12" fill="#555555">Security researcher reverse-engineered the 2021 Honda Civic's Android-based infotainment system.</text>
  <text x="40" y="574" font-size="12" fill="#555555">Publicly-known AOSP test key allows custom firmware installs via USB — no root required.</text>
  <text x="40" y="596" font-size="11" fill="#333333">→ Affects 2021 Honda Civic headunit running modified AOSP Android</text>
  <text x="40" y="612" font-size="11" fill="#333333">→ Publicly-known AOSP test key left in res/keys used for firmware verification</text>
  <text x="40" y="628" font-size="11" fill="#333333">→ USB drive with signed update file sufficient — no dealership access needed</text>

