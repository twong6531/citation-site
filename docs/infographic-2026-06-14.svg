  <text x="40" y="368" font-size="16" fill="#111111" font-weight="700">AMOC Cold Blob Signals Possible Climate Tipping</text>
  <text x="40" y="388" font-size="12" fill="#555555">A growing cold blob south of Greenland may indicate the AMOC ocean circulation is weakening.</text>
  <text x="40" y="404" font-size="12" fill="#555555">Collapse of AMOC would dramatically alter weather patterns across Europe and North America.</text>
  <text x="40" y="426" font-size="11" fill="#333333">→ Cold blob spans 1,000+ km in the North Atlantic south of Greenland</text>
  <text x="40" y="442" font-size="11" fill="#333333">→ AMOC has weakened ~15% since the mid-20th century per prior studies</text>
  <text x="40" y="458" font-size="11" fill="#333333">→ Collapse could lower European temperatures by 5–10°C over decades</text>

