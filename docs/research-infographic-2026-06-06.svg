<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 1600" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect width="800" height="1600" fill="#F7F7F5"/>

  <!-- HEADER (h=152) -->
  <rect x="0" y="0" width="800" height="4" fill="#111111"/>
  <text x="48" y="38" font-size="11" fill="#888888" letter-spacing="3">TRANSIT RESEARCH</text>
  <text x="48" y="78" font-size="28" fill="#111111" font-weight="700"><tspan>Urban Transit</tspan></text>
  <text x="48" y="112" font-size="28" fill="#111111" font-weight="700"><tspan>Network Optimization</tspan></text>
  <text x="48" y="136" font-size="11" fill="#888888" letter-spacing="1">June 6, 2026 — 9 Papers Analyzed</text>
  <line x1="0" y1="152" x2="800" y2="152" stroke="#DDDDDD" stroke-width="1"/>

  <!-- KEY FINDINGS (h=200) -->
  <text x="48" y="182" font-size="10" fill="#888888" letter-spacing="3" font-weight="600">KEY FINDINGS</text>
  <line x1="48" y1="192" x2="752" y2="192" stroke="#EEEEEE" stroke-width="1"/>

  <text x="48" y="226" font-size="30" fill="#0D9488" font-weight="700">01</text>
  <text x="94" y="216" font-size="13" fill="#111111" font-weight="700"><tspan>ML Replaces Fixed-Demand Planning</tspan></text>
  <text x="94" y="232" font-size="11" fill="#555555"><tspan>Two-level demand models separate core riders from conditional adopters,</tspan></text>
  <text x="94" y="247" font-size="11" fill="#555555"><tspan>producing fundamentally more realistic transit network designs.</tspan></text>

  <text x="48" y="284" font-size="30" fill="#0D9488" font-weight="700">02</text>
  <text x="94" y="274" font-size="13" fill="#111111" font-weight="700"><tspan>Spatial Heterogeneity Drives Ridership</tspan></text>
  <text x="94" y="290" font-size="11" fill="#555555"><tspan>GWR with station amenities explains 92.7% of ridership variance vs.</tspan></text>
  <text x="94" y="305" font-size="11" fill="#555555"><tspan>79.2% place-only — a critical 13-point accuracy advantage.</tspan></text>

  <text x="48" y="342" font-size="30" fill="#0D9488" font-weight="700">03</text>
  <text x="94" y="332" font-size="13" fill="#111111" font-weight="700"><tspan>Equity Must Be a Hard Constraint</tspan></text>
  <text x="94" y="348" font-size="11" fill="#555555"><tspan>AV integration without explicit equity design worsens outcomes for</tspan></text>
  <text x="94" y="363" font-size="11" fill="#555555"><tspan>low-income and peripheral communities across all studied models.</tspan></text>

  <line x1="0" y1="388" x2="800" y2="388" stroke="#DDDDDD" stroke-width="1"/>

  <!-- PAPER OF THE DAY (h=220) -->
  <text x="48" y="416" font-size="10" fill="#888888" letter-spacing="3" font-weight="600">PAPER OF THE DAY</text>
  <rect x="48" y="428" width="110" height="22" rx="11" fill="#0D9488"/>
  <text x="103" y="443" font-size="10" fill="#FFFFFF" text-anchor="middle" letter-spacing="1" font-weight="600">FEATURED</text>

  <text x="48" y="476" font-size="15" fill="#111111" font-weight="700"><tspan>Transit Network Design with Two-Level</tspan></text>
  <text x="48" y="496" font-size="15" fill="#111111" font-weight="700"><tspan>Demand Uncertainties</tspan></text>
  <text x="48" y="516" font-size="11" fill="#888888"><tspan>Guan, Basciftci, Van Hentenryck · arXiv:2603.00010</tspan></text>
  <text x="48" y="538" font-size="12" fill="#444444" font-style="italic"><tspan>ML mode-choice models embedded in CP-SAT optimization produce</tspan></text>
  <text x="48" y="554" font-size="12" fill="#444444" font-style="italic"><tspan>transit networks validated across Atlanta's metro area (38,000+ trips).</tspan></text>
  <rect x="48" y="568" width="72" height="20" rx="4" fill="#111111"/>
  <text x="84" y="582" font-size="10" fill="#FFFFFF" text-anchor="middle" font-weight="600">HIGH CONF.</text>

  <line x1="0" y1="604" x2="800" y2="604" stroke="#DDDDDD" stroke-width="1"/>

  <!-- EMERGING THEMES (3 columns, h=280) -->
  <text x="48" y="632" font-size="10" fill="#888888" letter-spacing="3" font-weight="600">EMERGING THEMES</text>
  <line x1="316" y1="648" x2="316" y2="860" stroke="#DDDDDD" stroke-width="1"/>
  <line x1="558" y1="648" x2="558" y2="860" stroke="#DDDDDD" stroke-width="1"/>

  <!-- Theme 1 -->
  <text x="48" y="668" font-size="12" fill="#0D9488" font-weight="700"><tspan>AI-Native Planning</tspan></text>
  <text x="48" y="688" font-size="10" fill="#555555"><tspan>ML moves from prediction</tspan></text>
  <text x="48" y="702" font-size="10" fill="#555555"><tspan>into network design itself.</tspan></text>
  <text x="48" y="716" font-size="10" fill="#555555"><tspan>Demand becomes a</tspan></text>
  <text x="48" y="730" font-size="10" fill="#555555"><tspan>probabilistic input, not a</tspan></text>
  <text x="48" y="744" font-size="10" fill="#555555"><tspan>fixed given. Two Atlanta</tspan></text>
  <text x="48" y="758" font-size="10" fill="#555555"><tspan>papers validate this shift</tspan></text>
  <text x="48" y="772" font-size="10" fill="#555555"><tspan>at metropolitan scale.</tspan></text>

  <!-- Theme 2 -->
  <text x="334" y="668" font-size="12" fill="#0D9488" font-weight="700"><tspan>Equity Engineering</tspan></text>
  <text x="334" y="688" font-size="10" fill="#555555"><tspan>Equity must be a hard</tspan></text>
  <text x="334" y="702" font-size="10" fill="#555555"><tspan>optimization constraint.</tspan></text>
  <text x="334" y="716" font-size="10" fill="#555555"><tspan>AV regulation, SAMS</tspan></text>
  <text x="334" y="730" font-size="10" fill="#555555"><tspan>integration, and informal</tspan></text>
  <text x="334" y="744" font-size="10" fill="#555555"><tspan>transit all confirm: market</tspan></text>
  <text x="334" y="758" font-size="10" fill="#555555"><tspan>defaults produce inequity</tspan></text>
  <text x="334" y="772" font-size="10" fill="#555555"><tspan>without policy guardrails.</tspan></text>

  <!-- Theme 3 -->
  <text x="576" y="668" font-size="12" fill="#0D9488" font-weight="700"><tspan>Mobility Statistics</tspan></text>
  <text x="576" y="688" font-size="10" fill="#555555"><tspan>Bogotá's 2.3B trips confirm</tspan></text>
  <text x="576" y="702" font-size="10" fill="#555555"><tspan>Lévy-flight statistics govern</tspan></text>
  <text x="576" y="716" font-size="10" fill="#555555"><tspan>urban transit. Patterns are</tspan></text>
  <text x="576" y="730" font-size="10" fill="#555555"><tspan>stable despite major policy</tspan></text>
  <text x="576" y="744" font-size="10" fill="#555555"><tspan>changes — cities should</tspan></text>
  <text x="576" y="758" font-size="10" fill="#555555"><tspan>match infrastructure to</tspan></text>
  <text x="576" y="772" font-size="10" fill="#555555"><tspan>established behavior.</tspan></text>

  <line x1="0" y1="862" x2="800" y2="862" stroke="#DDDDDD" stroke-width="1"/>

  <!-- CONFIDENCE CHART (h=160) -->
  <text x="48" y="892" font-size="10" fill="#888888" letter-spacing="3" font-weight="600">CONFIDENCE DISTRIBUTION — 9 PAPERS</text>

  <text x="48" y="924" font-size="11" fill="#111111" font-weight="600">HIGH</text>
  <rect x="130" y="910" width="400" height="22" rx="2" fill="#0D9488"/>
  <text x="540" y="926" font-size="11" fill="#111111" font-weight="600">6 papers</text>

  <text x="48" y="966" font-size="11" fill="#111111" font-weight="600">MED</text>
  <rect x="130" y="952" width="134" height="22" rx="2" fill="#0D9488" opacity="0.5"/>
  <text x="274" y="968" font-size="11" fill="#111111" font-weight="600">2 papers</text>

  <text x="48" y="1008" font-size="11" fill="#888888" font-weight="600">LOW</text>
  <text x="140" y="1008" font-size="11" fill="#AAAAAA">0 papers</text>

  <line x1="0" y1="1028" x2="800" y2="1028" stroke="#DDDDDD" stroke-width="1"/>

  <!-- ACTIONABLE TAKEAWAYS (h=280) -->
  <text x="48" y="1058" font-size="10" fill="#888888" letter-spacing="3" font-weight="600">ACTIONABLE TAKEAWAYS</text>

  <text x="48" y="1096" font-size="22" fill="#0D9488" font-weight="700">1</text>
  <text x="80" y="1088" font-size="12" fill="#111111" font-weight="700"><tspan>Adopt Two-Level Demand Models</tspan></text>
  <text x="80" y="1105" font-size="11" fill="#555555"><tspan>Replace fixed-demand planning with frameworks separating core riders</tspan></text>
  <text x="80" y="1120" font-size="11" fill="#555555"><tspan>from conditional adopters — 2LRC-TND validated at Atlanta metro scale.</tspan></text>

  <text x="48" y="1154" font-size="22" fill="#0D9488" font-weight="700">2</text>
  <text x="80" y="1146" font-size="12" fill="#111111" font-weight="700"><tspan>Mandate Equity-as-Constraint in AV Procurement</tspan></text>
  <text x="80" y="1163" font-size="11" fill="#555555"><tspan>Require equity scoring as a binding optimization objective in any AV</tspan></text>
  <text x="80" y="1178" font-size="11" fill="#555555"><tspan>or shared mobility service integration — market defaults worsen equity.</tspan></text>

  <text x="48" y="1212" font-size="22" fill="#0D9488" font-weight="700">3</text>
  <text x="80" y="1204" font-size="12" fill="#111111" font-weight="700"><tspan>Use GWR for Station Investment Prioritization</tspan></text>
  <text x="80" y="1221" font-size="11" fill="#555555"><tspan>GWR with amenity data explains 92.7% of ridership variance — agencies</tspan></text>
  <text x="80" y="1236" font-size="11" fill="#555555"><tspan>can immediately improve investment targeting with spatial analysis.</tspan></text>

  <text x="48" y="1270" font-size="22" fill="#0D9488" font-weight="700">4</text>
  <text x="80" y="1262" font-size="12" fill="#111111" font-weight="700"><tspan>Subsidize Informal Transit Routes Before Formalizing</tspan></text>
  <text x="80" y="1279" font-size="11" fill="#555555"><tspan>Targeted cross-subsidization improves informal transit efficiency</tspan></text>
  <text x="80" y="1294" font-size="11" fill="#555555"><tspan>without the political costs of full formalization — applicable globally.</tspan></text>

  <line x1="0" y1="1318" x2="800" y2="1318" stroke="#DDDDDD" stroke-width="1"/>

  <!-- CONTRARIAN INSIGHT -->
  <text x="48" y="1348" font-size="10" fill="#888888" letter-spacing="3" font-weight="600">CONTRARIAN INSIGHT</text>
  <rect x="48" y="1362" width="4" height="110" fill="#0D9488"/>
  <text x="68" y="1382" font-size="13" fill="#111111" font-weight="700"><tspan>More transit does not automatically mean cleaner air</tspan></text>
  <text x="68" y="1402" font-size="11" fill="#555555"><tspan>The multi-city PM2.5 study shows transit-air quality relationships are highly city-specific.</tspan></text>
  <text x="68" y="1418" font-size="11" fill="#555555"><tspan>NYC dynamics differ fundamentally from Phoenix. Cities should audit their own pathways</tspan></text>
  <text x="68" y="1434" font-size="11" fill="#555555"><tspan>rather than citing aggregate statistics. Similarly, AV service mandates reduce geographic</tspan></text>
  <text x="68" y="1450" font-size="11" fill="#555555"><tspan>inequality but worsen income inequality — a finding that should challenge assumptions</tspan></text>
  <text x="68" y="1466" font-size="11" fill="#555555"><tspan>among advocates who treat spatial coverage requirements as equity tools.</tspan></text>

