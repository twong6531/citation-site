<text x="40" y="586" font-size="17" font-weight="bold" fill="#111111">Lithuania Crowdsources Shahed Drone Detection</text>
<text x="40" y="610" font-size="12" fill="#555555">A Lithuanian startup and volunteers launched Drone Radaras, an open-source network that</text>
<text x="40" y="626" font-size="12" fill="#555555">links data from civilians&#x27; phones to spot Shahed-type loitering drones. The tool responds to</text>
<text x="40" y="660" font-size="11" fill="#777777">&#8226; Shahed-136 drones carry a 50-90 kg warhead and fly over 185 km/h</text>
<text x="40" y="675" font-size="11" fill="#777777">&#8226; Russia has built roughly 26,000 Geran-2 (Shahed) drones at its Alabuga plant</text>
