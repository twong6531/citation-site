<text x="40" y="396" font-size="17" font-weight="bold" fill="#111111">GPT-5.5 Hallucinates 3x More Than Open Rival</text>
<text x="40" y="420" font-size="12" fill="#555555">Benchmark testing found GPT-5.5 hallucinates on 86% of unanswerable questions, nearly 3x the</text>
<text x="40" y="436" font-size="12" fill="#555555">28% rate of the much smaller, MIT-licensed GLM-5.2. The gap suggests raw parameter scaling</text>
<text x="40" y="470" font-size="11" fill="#777777">&#8226; GLM-5.2 (753B params, ~40B active) hit a 28% hallucination rate vs GPT-5.5&#x27;s 86%</text>
<text x="40" y="485" font-size="11" fill="#777777">&#8226; GLM-5.2 scored within 4 points of GPT-5.5 on the AA Intelligence Index</text>
<text x="40" y="500" font-size="11" fill="#777777">&#8226; DeepSeek V4 Pro reasoned for 3m26s to give a confidently wrong answer GLM-5.2 solved correctly in 12 seconds</text>
