<text x="40" y="402" font-size="16" font-weight="bold" fill="#111111">Open-Source ATS Scores Same Resume Three Ways</text>
<text x="40" y="424" font-size="12" fill="#666666">A developer tested HackerRank&#x27;s newly open-sourced applicant tracking system on his own</text>
