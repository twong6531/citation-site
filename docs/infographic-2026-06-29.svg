<text x="40" y="1008" font-size="16" font-weight="bold" fill="#111111">Memory Makers Sued Over Price Fixing</text>
<text x="40" y="1030" font-size="12" fill="#666666">Samsung, SK Hynix, and Micron — the three companies that together dominate global memory-</text>
