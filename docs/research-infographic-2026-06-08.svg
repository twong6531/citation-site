  <text x="48" y="115" font-size="46" fill="#1A1A1A" font-weight="700" letter-spacing="-1">Urban Mobility</text>
  <text x="48" y="158" font-size="46" fill="#1A1A1A" font-weight="700" letter-spacing="-1">June 8, 2026</text>
  <text x="48" y="190" font-size="13" fill="#555">12 papers analyzed &nbsp;|&nbsp; arXiv &amp; Semantic Scholar &nbsp;|&nbsp; Auto-generated research digest</text>
  <line x1="48" y1="208" x2="752" y2="208" stroke="#D0D0D0" stroke-width="1"/>

  <!-- EXECUTIVE SUMMARY -->
  <text x="48" y="246" font-size="10" fill="#888" letter-spacing="3" font-weight="600">EXECUTIVE SUMMARY</text>
  <text x="48" y="276" font-size="14" fill="#1A1A1A" font-weight="400">
    <tspan x="48" dy="0">The June 2026 transit research landscape reveals transformation across three converging fronts:</tspan>
    <tspan x="48" dy="22">AI-native planning systems, electrification economics, and behavioral data exploitation. A slime-mold-</tspan>
    <tspan x="48" dy="22">inspired swarm transit system beats fixed networks by 28–101%; EV charging behavioral data from</tspan>
    <tspan x="48" dy="22">760K+ drivers rewrites infrastructure siting rules; and ISO 26262 safety frameworks are declared</tspan>
    <tspan x="48" dy="22">conceptually inadequate for driverless vehicles. Equity runs as a cross-cutting theme throughout.</tspan>
  </text>
  <line x1="48" y1="395" x2="752" y2="395" stroke="#D0D0D0" stroke-width="1"/>

  <!-- KEY FINDINGS -->
  <text x="48" y="430" font-size="10" fill="#888" letter-spacing="3" font-weight="600">KEY FINDINGS</text>

  <!-- Finding 1 -->
  <text x="48" y="466" font-size="52" fill="#E8E8E8" font-weight="700">01</text>
  <text x="48" y="462" font-size="13" fill="#1A1A1A" font-weight="700">
    <tspan x="110" dy="0">Slime Mold Beats the Schedule</tspan>
  </text>
  <text x="110" y="480" font-size="12" fill="#444">
    <tspan x="110" dy="0">A biologically-inspired swarm transit system where buses bid cooperatively for passengers</tspan>
    <tspan x="110" dy="18">improves passenger delivery rates by 28–101% over fixed-route networks across suburban,</tspan>
    <tspan x="110" dy="18">urban, and semi-rural scenarios. Distributed intelligence eliminates scheduler failure points.</tspan>
  </text>

  <!-- Finding 2 -->
  <text x="48" y="568" font-size="52" fill="#E8E8E8" font-weight="700">02</text>
  <text x="48" y="564" font-size="13" fill="#1A1A1A" font-weight="700">
    <tspan x="110" dy="0">Wheelchair Users Lose 30–40% of Job Access to ADA Gaps</tspan>
  </text>
  <text x="110" y="582" font-size="12" fill="#444">
    <tspan x="110" dy="0">OPENPATH, an LLM-powered multi-agent trip planner tested on NYC data, quantifies the</tspan>
    <tspan x="110" dy="18">measurable job accessibility cost of ADA infrastructure deficiencies — turning abstract equity</tspan>
    <tspan x="110" dy="18">concerns into concrete policy metrics for the first time at city scale.</tspan>
  </text>

  <!-- Finding 3 -->
  <text x="48" y="670" font-size="52" fill="#E8E8E8" font-weight="700">03</text>
  <text x="48" y="666" font-size="13" fill="#1A1A1A" font-weight="700">
    <tspan x="110" dy="0">EV Climate Math Depends on the Grid, Not the Car</tspan>
  </text>
  <text x="110" y="684" font-size="12" fill="#444">
    <tspan x="110" dy="0">Shanghai city-scale modeling reveals real EV consumption far exceeds test-cycle values,</tspan>
    <tspan x="110" dy="18">and that grid carbon intensity — not vehicle efficiency — determines most climate impact.</tspan>
    <tspan x="110" dy="18">Policy must pair EV mandates with grid decarbonization or risk overstating climate benefits.</tspan>
  </text>
  <line x1="48" y1="733" x2="752" y2="733" stroke="#D0D0D0" stroke-width="1"/>

