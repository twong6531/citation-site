  <text x="48" y="1345" font-size="12" fill="#1A1A1A" font-weight="700">&#x25B6; For Transit Agencies</text>
  <text x="48" y="1365" font-size="12" fill="#444">
    <tspan x="48" dy="0">Pilot demand-responsive swarm routing in low-density suburbs before building new fixed</tspan>
    <tspan x="48" dy="18">infrastructure — simulation data shows 28–101% improvement in passenger delivery rates.</tspan>
  </text>

  <text x="48" y="1405" font-size="12" fill="#1A1A1A" font-weight="700">&#x25B6; For Charging Network Operators</text>
  <text x="48" y="1425" font-size="12" fill="#444">
    <tspan x="48" dy="0">Co-locate charging stations with restaurants and retail; GPS data from 760K+ EV drivers</tspan>
    <tspan x="48" dy="18">confirms trip-bundling and food/beverage patronage during charging dwell time.</tspan>
  </text>

  <text x="48" y="1465" font-size="12" fill="#1A1A1A" font-weight="700">&#x25B6; For City Planners &amp; Policymakers</text>
  <text x="48" y="1485" font-size="12" fill="#444">
