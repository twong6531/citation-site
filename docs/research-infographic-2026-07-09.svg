<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1600" font-family="Helvetica, Arial, sans-serif">
  <rect width="800" height="1600" fill="#F7F7F5"/>
  <rect x="0" y="0" width="800" height="120" fill="#1A1A2E"/>
  <text x="48" y="52" fill="#F7F7F5" font-size="11" font-weight="400" letter-spacing="3">TRANSIT RESEARCH DIGEST</text>
  <text x="48" y="82" fill="#FFFFFF" font-size="28" font-weight="700" letter-spacing="-0.5">July 9, 2026</text>
  <text x="48" y="106" fill="#8899BB" font-size="12" font-weight="400">10 papers · arXiv · Semantic Scholar · AI-synthesized analysis</text>
  <rect x="0" y="120" width="800" height="4" fill="#E63946"/>
  <text x="48" y="168" fill="#1A1A2E" font-size="10" font-weight="700" letter-spacing="3">KEY FINDINGS</text>
  <line x1="48" y1="174" x2="752" y2="174" stroke="#1A1A2E" stroke-width="1"/>
  <rect x="48" y="188" width="40" height="40" fill="#1A1A2E"/>
  <text x="68" y="214" fill="#FFFFFF" font-size="22" font-weight="700" text-anchor="middle">1</text>
  <text x="102" y="204" fill="#1A1A2E" font-size="14" font-weight="700">NYC Congestion Pricing Boosts Transit</text>
  <text x="102" y="222" fill="#444444" font-size="12" font-weight="400">Bus + subway ridership increased significantly vs. no-policy counterfactual</text>
  <text x="102" y="238" fill="#444444" font-size="12" font-weight="400">after January 2025 cordon pricing. Transit gains extend beyond Manhattan.</text>
  <rect x="48" y="258" width="40" height="40" fill="#E63946"/>
  <text x="68" y="284" fill="#FFFFFF" font-size="22" font-weight="700" text-anchor="middle">2</text>
  <text x="102" y="274" fill="#1A1A2E" font-size="14" font-weight="700">Transit Deserts: Risk-Aware AI Remediation</text>
  <text x="102" y="292" fill="#444444" font-size="12" font-weight="400">POMDP framework remediates 53.6% of transit-desert tracts over 5 years</text>
  <text x="102" y="308" fill="#444444" font-size="12" font-weight="400">across 25 US cities, outperforming static optimization by 5.0 pp.</text>
  <rect x="48" y="328" width="40" height="40" fill="#457B9D"/>
  <text x="68" y="354" fill="#FFFFFF" font-size="22" font-weight="700" text-anchor="middle">3</text>
  <text x="102" y="344" fill="#1A1A2E" font-size="14" font-weight="700">Mobility Data Systematically Misrepresents Elderly</text>
  <text x="102" y="362" fill="#444444" font-size="12" font-weight="400">Elderly riders have 19.4% smaller activity spaces and 56% lower entropy.</text>
  <text x="102" y="378" fill="#444444" font-size="12" font-weight="400">Majority-population models overestimate their step length by 4.5%.</text>
  <line x1="48" y1="404" x2="752" y2="404" stroke="#DDDDDD" stroke-width="1"/>
  <text x="48" y="430" fill="#1A1A2E" font-size="10" font-weight="700" letter-spacing="3">PAPER OF THE DAY</text>
  <rect x="48" y="438" width="704" height="110" fill="#1A1A2E"/>
  <rect x="48" y="438" width="4" height="110" fill="#E63946"/>
  <text x="68" y="462" fill="#AABBDD" font-size="10" font-weight="400" letter-spacing="2">arXiv 2606.17530 · Li et al., 2026</text>
  <text x="68" y="484" fill="#FFFFFF" font-size="15" font-weight="700">Public transit gains and spatially uneven travel demand</text>
  <text x="68" y="502" fill="#FFFFFF" font-size="15" font-weight="700">changes after NYC congestion pricing</text>
  <text x="68" y="524" fill="#CCCCCC" font-size="12" font-weight="400">First rigorous evaluation of the US's first cordon pricing program. Time series</text>
  <text x="68" y="540" fill="#CCCCCC" font-size="12" font-weight="400">foundation models generate counterfactual demand forecasts.</text>
  <text x="68" y="556" fill="#E63946" font-size="12" font-weight="700">Transit gains extend beyond the CRZ — challenges zone-centric policy models.</text>
  <line x1="48" y1="568" x2="752" y2="568" stroke="#DDDDDD" stroke-width="1"/>
  <text x="48" y="594" fill="#1A1A2E" font-size="10" font-weight="700" letter-spacing="3">EMERGING THEMES</text>
  <rect x="48" y="604" width="210" height="3" fill="#E63946"/>
  <text x="48" y="626" fill="#1A1A2E" font-size="13" font-weight="700">Pricing as</text>
  <text x="48" y="642" fill="#1A1A2E" font-size="13" font-weight="700">Transit Lever</text>
  <text x="48" y="664" fill="#444444" font-size="11">Congestion pricing now</text>
  <text x="48" y="680" fill="#444444" font-size="11">empirically validated as a</text>
  <text x="48" y="696" fill="#444444" font-size="11">dual-action tool: reduces</text>
  <text x="48" y="712" fill="#444444" font-size="11">car travel AND grows</text>
  <text x="48" y="728" fill="#444444" font-size="11">transit ridership.</text>
  <rect x="296" y="604" width="210" height="3" fill="#457B9D"/>
  <text x="296" y="626" fill="#1A1A2E" font-size="13" font-weight="700">AI Planning</text>
  <text x="296" y="642" fill="#1A1A2E" font-size="13" font-weight="700">for Equity</text>
  <text x="296" y="664" fill="#444444" font-size="11">ML and causal AI now plan</text>
  <text x="296" y="680" fill="#444444" font-size="11">transit service in data-scarce</text>
  <text x="296" y="696" fill="#444444" font-size="11">underserved areas where</text>
  <text x="296" y="712" fill="#444444" font-size="11">ridership can't be</text>
  <text x="296" y="728" fill="#444444" font-size="11">pre-observed.</text>
  <rect x="544" y="604" width="208" height="3" fill="#2D6A4F"/>
  <text x="544" y="626" fill="#1A1A2E" font-size="13" font-weight="700">Representational</text>
  <text x="544" y="642" fill="#1A1A2E" font-size="13" font-weight="700">Bias in Data</text>
  <text x="544" y="664" fill="#444444" font-size="11">GPS datasets systematically</text>
  <text x="544" y="680" fill="#444444" font-size="11">underrepresent elderly,</text>
  <text x="544" y="696" fill="#444444" font-size="11">low-income, and rural</text>
  <text x="544" y="712" fill="#444444" font-size="11">populations. Bias is</text>
  <text x="544" y="728" fill="#444444" font-size="11">source-specific.</text>
  <line x1="48" y1="748" x2="752" y2="748" stroke="#DDDDDD" stroke-width="1"/>
  <text x="48" y="774" fill="#1A1A2E" font-size="10" font-weight="700" letter-spacing="3">CONFIDENCE DISTRIBUTION</text>
  <text x="48" y="800" fill="#444444" font-size="11">High</text>
  <rect x="120" y="788" width="380" height="16" fill="#1A1A2E"/>
  <text x="508" y="800" fill="#333333" font-size="11" font-weight="700">  5 papers (50%)</text>
  <text x="48" y="828" fill="#444444" font-size="11">Medium</text>
  <rect x="120" y="816" width="228" height="16" fill="#457B9D"/>
  <text x="356" y="828" fill="#457B9D" font-size="11" font-weight="700">  5 papers (50%)</text>
  <line x1="120" y1="840" x2="500" y2="840" stroke="#CCCCCC" stroke-width="1"/>
  <text x="120" y="854" fill="#888888" font-size="10">0</text>
  <text x="495" y="854" fill="#888888" font-size="10">10</text>
  <line x1="48" y1="872" x2="752" y2="872" stroke="#DDDDDD" stroke-width="1"/>
  <text x="48" y="898" fill="#1A1A2E" font-size="10" font-weight="700" letter-spacing="3">ACTIONABLE TAKEAWAYS</text>
  <rect x="48" y="910" width="3" height="52" fill="#E63946"/>
  <text x="62" y="928" fill="#1A1A2E" font-size="12" font-weight="700">Plan for spillover demand in peripheral neighborhoods</text>
  <text x="62" y="946" fill="#444444" font-size="11">Cities adopting congestion pricing should pre-position transit capacity</text>
  <text x="62" y="962" fill="#444444" font-size="11">beyond the cordon zone to capture city-wide ridership gains.</text>
  <rect x="48" y="978" width="3" height="52" fill="#457B9D"/>
  <text x="62" y="996" fill="#1A1A2E" font-size="12" font-weight="700">Audit mobility datasets for demographic representation</text>
  <text x="62" y="1014" fill="#444444" font-size="11">Before deploying AI-driven transit planning tools, agencies must assess</text>
  <text x="62" y="1030" fill="#444444" font-size="11">whether training data adequately represents elderly and low-income riders.</text>
  <rect x="48" y="1046" width="3" height="52" fill="#2D6A4F"/>
  <text x="62" y="1064" fill="#1A1A2E" font-size="12" font-weight="700">Use risk-aware (CVaR) deployment for transit deserts</text>
  <text x="62" y="1082" fill="#444444" font-size="11">Adaptive sequential service deployment outperforms static optimization by</text>
  <text x="62" y="1098" fill="#444444" font-size="11">5pp — with best gains at moderate budget levels, not maximum funding.</text>
  <line x1="48" y1="1118" x2="752" y2="1118" stroke="#DDDDDD" stroke-width="1"/>
  <text x="48" y="1144" fill="#1A1A2E" font-size="10" font-weight="700" letter-spacing="3">CONTRARIAN INSIGHT</text>
  <rect x="48" y="1154" width="704" height="72" fill="#FFF8F0"/>
  <rect x="48" y="1154" width="4" height="72" fill="#E63946"/>
  <text x="68" y="1176" fill="#444444" font-size="12">Larger AI models do NOT improve transit planning under data scarcity.</text>
  <text x="68" y="1194" fill="#444444" font-size="12">A Qwen3-4B LLM performed no better than a first-order Markov chain</text>
  <text x="68" y="1212" fill="#444444" font-size="12">for elderly trajectory generation when training data was limited.</text>
  <line x1="48" y1="1246" x2="752" y2="1246" stroke="#DDDDDD" stroke-width="1"/>
  <text x="48" y="1272" fill="#1A1A2E" font-size="10" font-weight="700" letter-spacing="3">PAPERS REVIEWED TODAY</text>
  <text x="48" y="1296" fill="#888888" font-size="11">1  NYC Congestion Pricing and Transit Gains · Li et al. · arXiv 2606.17530</text>
  <text x="48" y="1314" fill="#888888" font-size="11">2  Transit Desert Remediation · Khoroshevskaya et al. · arXiv 2606.08371</text>
  <text x="48" y="1332" fill="#888888" font-size="11">3  Inclusive Mobility: Elderly Trajectory Patterns · Wang et al. · arXiv 2606.31207</text>
  <text x="48" y="1350" fill="#888888" font-size="11">4  NetMob26 Bus Dataset, Niterói · Domingos et al. · arXiv 2605.20263</text>
  <text x="48" y="1368" fill="#888888" font-size="11">5  E-Scooter Hub Planning AI · Jin et al. · arXiv 2606.25484</text>
  <text x="48" y="1386" fill="#888888" font-size="11">6  GPS Mobility Data Representativeness · Cabrera et al. · arXiv 2606.23616</text>
  <text x="48" y="1404" fill="#888888" font-size="11">7  AAM Ride-Hail Subsidy Design · Ji et al. · arXiv 2606.21390</text>
  <text x="48" y="1422" fill="#888888" font-size="11">8  Virginia Tech Transportation Safety Index · Cusati &amp; Chuang · arXiv 2606.21154</text>
  <text x="48" y="1440" fill="#888888" font-size="11">9  SF-LIFE Simulated Bay Area Dataset · Algama et al. · arXiv 2606.00430</text>
  <text x="48" y="1458" fill="#888888" font-size="11">10 Urban Mobility Analytics Framework · Andrade et al. · arXiv 2607.03394</text>
  <rect x="0" y="1516" width="800" height="60" fill="#1A1A2E"/>
