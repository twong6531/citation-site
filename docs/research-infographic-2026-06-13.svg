  <text x="40" y="68" font-size="28" fill="#FFFFFF" font-weight="700" letter-spacing="-0.5">URBAN MOBILITY RESEARCH</text>
  <text x="40" y="90" font-size="11" fill="#999" letter-spacing="2">JUNE 13, 2026 — 10 PAPERS ANALYZED</text>
  <text x="40" y="135" font-size="10" fill="#888" letter-spacing="2" font-weight="600">EXECUTIVE SUMMARY</text>
  <line x1="40" y1="142" x2="760" y2="142" stroke="#DDDDDD" stroke-width="1"/>
  <text x="40" y="162" font-size="13" fill="#333">Today's transit research reveals a field at an inflection point: data science and</text>
  <text x="40" y="180" font-size="13" fill="#333">machine learning are rapidly moving from theoretical tools to deployed solutions, while</text>
  <text x="40" y="198" font-size="13" fill="#333">equity and resilience emerge as the central planning values for the next decade. Across</text>
  <text x="40" y="216" font-size="13" fill="#333">10 papers spanning bibliometrics, case studies, and network theory, a consistent finding</text>
  <text x="40" y="234" font-size="13" fill="#333">emerges—interconnected, data-informed, and socially aware transit systems outperform</text>
  <text x="40" y="277" font-size="10" fill="#888" letter-spacing="2" font-weight="600">KEY FINDINGS</text>
  <line x1="40" y1="284" x2="760" y2="284" stroke="#DDDDDD" stroke-width="1"/>
  <text x="40" y="321" font-size="36" fill="#E8E8E3" font-weight="700">01</text>
  <text x="100" y="317" font-size="12" fill="#1A1A1A" font-weight="700" letter-spacing="1">INTERCONNECTION BEATS HARDENING</text>
  <text x="100" y="335" font-size="12" fill="#555">Hong Kong data shows multimodal network connections reduce disruption impact</text>
  <text x="100" y="352" font-size="12" fill="#555">more cost-effectively than reinforcing individual lines</text>
  <text x="40" y="409" font-size="36" fill="#E8E8E3" font-weight="700">02</text>
  <text x="100" y="405" font-size="12" fill="#1A1A1A" font-weight="700" letter-spacing="1">BRT EQUITY VARIES BY CORRIDOR</text>
  <text x="100" y="423" font-size="12" fill="#555">Guatemala City BRT narrowed inequality gap; San Salvador and Tegucigalpa saw</text>
  <text x="100" y="440" font-size="12" fill="#555">minimal equity gains—route alignment is decisive</text>
  <text x="40" y="497" font-size="36" fill="#E8E8E3" font-weight="700">03</text>
  <text x="100" y="493" font-size="12" fill="#1A1A1A" font-weight="700" letter-spacing="1">RIDE-SHARING IS A COMPLEMENT, NOT RIVAL</text>
  <text x="100" y="511" font-size="12" fill="#555">CNN analysis of Paris shows TNCs fill transit gaps in underserved areas</text>
  <text x="100" y="528" font-size="12" fill="#555">off-peak; compete only downtown at peak</text>
  <rect x="40" y="573" width="720" height="120" fill="#1A1A1A" rx="2"/>
  <text x="60" y="595" font-size="9" fill="#888" letter-spacing="3" font-weight="600">PAPER OF THE DAY</text>
  <text x="60" y="617" font-size="13" fill="#FFFFFF" font-weight="700">#10 — Interconnectedness Enhances Network Resilience of Multimodal Public </text>
  <text x="60" y="635" font-size="11" fill="#AAA">Xu & Chopra · Nature Communications 2023 · 83 citations</text>
  <text x="60" y="655" font-size="11" fill="#CCC">Xu & Chopra's Nature Communications paper (83 citations) provides the field's most</text>
  <text x="60" y="672" font-size="11" fill="#CCC">methodologically rigorous framework for transit resilience, establishing that</text>
  <text x="60" y="689" font-size="11" fill="#CCC">interconnection is more valuable than hardening—a finding directly actionable for every</text>
  <text x="40" y="713" font-size="10" fill="#888" letter-spacing="2" font-weight="600">EMERGING THEMES</text>
