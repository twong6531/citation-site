  <rect x="76" y="1048" width="42" height="18" rx="3" fill="#00897B"/>
  <text x="97" y="1061" text-anchor="middle" font-size="9" fill="#FFF" font-weight="700">TECH</text>
  <text x="130" y="1062" font-size="11" fill="#00897B" font-weight="600">Impact Score: 6/10</text>
  <text x="56" y="1086" font-size="16" fill="#111" font-weight="700">IOCCC Crowns Masters of Unreadable C Code</text>
  <text x="56" y="1104" font-size="12" fill="#555">The 29th International Obfuscated C Code Contest announces 2025 winners with mind-bending entries.</text>
  <text x="56" y="1118" font-size="12" fill="#555">Running since 1984, the contest celebrates C programs that work correctly while being deliberately incomprehensible.</text>
  <text x="56" y="1138" font-size="11" fill="#444">• 29th annual contest — running continuously since 1984</text>
  <text x="56" y="1154" font-size="11" fill="#444">• Winning entries often compute complex algorithms in single-line expressions</text>
