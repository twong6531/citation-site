  <text x="300" y="690" font-size="11" fill="#555555"><tspan x="300" dy="0">data miss elderly, rural, and</tspan></text>
  <text x="300" y="706" font-size="11" fill="#555555"><tspan x="300" dy="0">low-income riders. Model</tspan></text>
