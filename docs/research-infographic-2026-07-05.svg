  <text x="40" y="984" font-size="12" fill="#111111" font-weight="700">→</text>
  <text x="60" y="984" font-size="12" fill="#333333"><tspan x="60" dy="0">Cold-climate e-bus agencies: run WeatherRobustBus-style</tspan></text>
