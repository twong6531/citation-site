  <text x="40" y="1026" font-size="12" fill="#111111" font-weight="700">→</text>
  <text x="60" y="1026" font-size="12" fill="#333333"><tspan x="60" dy="0">Require GPS mobility data vendors to disclose coverage</tspan></text>
