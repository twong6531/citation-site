  <text x="40" y="530" font-size="12" fill="#444444" font-style="italic">
    <tspan x="40" dy="0">First empirical evaluation of a U.S. cordon congestion pricing program using</tspan>
    <tspan x="40" dy="17">time-series foundation models as counterfactuals — proving transit gains were real.</tspan>
  </text>

