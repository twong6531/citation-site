  <text x="60" y="1068" font-size="12" fill="#333333"><tspan x="60" dy="0">V2G and hydrogen backup contracts must include operation-</tspan></text>
  <text x="60" y="1084" font-size="12" fill="#333333"><tspan x="60" dy="0">based coordination modes with auditable tariff-setting.</tspan></text>

