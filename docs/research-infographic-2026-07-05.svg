  <text x="96" y="185" font-size="14" fill="#111111" font-weight="700">NYC Congestion Pricing Boosts Transit</text>
  <text x="96" y="203" font-size="12" fill="#444444">Bus and subway ridership exceeded counterfactual forecasts</text>
  <text x="96" y="219" font-size="12" fill="#444444">after January 2025 implementation; outer boroughs gained most.</text>

  <!-- Finding 2 -->
  <text x="40" y="252" font-size="40" fill="#E8E8E6" font-weight="700">02</text>
  <text x="96" y="249" font-size="14" fill="#111111" font-weight="700">Cold Waves Cascade Electric Bus Failures</text>
  <text x="96" y="267" font-size="12" fill="#444444">Cabin heating — not traction — drains batteries in winter.</text>
  <text x="96" y="283" font-size="12" fill="#444444">Failure probability drops 0.759 → 0.112 with opportunity charging.</text>

  <!-- Finding 3 -->
  <text x="40" y="316" font-size="40" fill="#E8E8E6" font-weight="700">03</text>
  <text x="96" y="313" font-size="14" fill="#111111" font-weight="700">AI Aggregators Threaten Public Transit Value</text>
  <text x="96" y="331" font-size="12" fill="#444444">Profit-oriented V2G aggregators extract value from transit operators.</text>
  <text x="96" y="347" font-size="12" fill="#444444">Governance frameworks required before public fleet deployment.</text>

