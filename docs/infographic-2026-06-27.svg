<text x="40" y="806" font-size="16" font-weight="bold" fill="#111111">Engineers Share a Fintech Engineering Handbook</text>
<text x="40" y="828" font-size="12" fill="#666666">A widely shared handbook lays out the architecture patterns banks and payment startups</text>
<text x="40" y="844" font-size="12" fill="#666666">use to move money safely, from ledgers to reconciliation jobs.</text>
<circle cx="44" cy="858" r="2.5" fill="#2E7D32"/>
<text x="54" y="862" font-size="11.5" fill="#444444">Story drew 235 points on Hacker News</text>
<circle cx="44" cy="875" r="2.5" fill="#2E7D32"/>
<text x="54" y="879" font-size="11.5" fill="#444444">Covers double-entry ledgers, idempotent transactions, and reconciliation patterns</text>
<circle cx="44" cy="892" r="2.5" fill="#2E7D32"/>
<text x="54" y="896" font-size="11.5" fill="#444444">Aimed at engineers building production fintech and payments systems</text>
