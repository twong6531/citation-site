<text x="740" y="370" font-size="18" text-anchor="end">⚡</text>
<text x="40" y="402" font-size="16" font-weight="bold" fill="#111111">DeepSeek&#x27;s DSpark Speeds Up LLM Inference</text>
<text x="40" y="424" font-size="12" fill="#666666">DeepSeek researchers published a paper on DSpark, a speculative decoding technique that</text>
<text x="40" y="440" font-size="12" fill="#666666">drafts multiple tokens ahead and verifies them in parallel to cut generation latency.</text>
<circle cx="44" cy="454" r="2.5" fill="#6C47FF"/>
<text x="54" y="458" font-size="11.5" fill="#444444">Story drew 563 points on Hacker News</text>
<circle cx="44" cy="471" r="2.5" fill="#6C47FF"/>
<text x="54" y="475" font-size="11.5" fill="#444444">DSpark accelerates inference via speculative decoding rather than larger hardware</text>
<circle cx="44" cy="488" r="2.5" fill="#6C47FF"/>
<text x="54" y="492" font-size="11.5" fill="#444444">Published as a technical PDF on DeepSeek&#x27;s public DeepSpec GitHub repository</text>
