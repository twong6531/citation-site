<circle cx="44" cy="1279" r="2.5" fill="#00897B"/>
<text x="54" y="1283" font-size="11.5" fill="#444444">Law takes effect July 1, 2026 in California</text>
<circle cx="44" cy="1296" r="2.5" fill="#00897B"/>
<text x="54" y="1300" font-size="11.5" fill="#444444">Streaming services must keep ad volume consistent across TVs, tablets, and phones</text>
