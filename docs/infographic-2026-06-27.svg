<text x="40" y="1210" font-size="16" font-weight="bold" fill="#111111">Loud Streaming Ads Become Illegal in California</text>
<text x="40" y="1232" font-size="12" fill="#666666">Starting July 1, it becomes illegal in California for streaming platforms to play ads</text>
<text x="40" y="1248" font-size="12" fill="#666666">louder than the show or movie being watched.</text>
<circle cx="44" cy="1262" r="2.5" fill="#00897B"/>
