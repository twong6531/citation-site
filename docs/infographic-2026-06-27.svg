<text x="40" y="604" font-size="16" font-weight="bold" fill="#111111">Why Kinetic Energy Scales With Speed Squared</text>
<text x="40" y="626" font-size="12" fill="#666666">A 2011 physics Stack Exchange answer explaining why kinetic energy grows quadratically, not</text>
<text x="40" y="642" font-size="12" fill="#666666">linearly, with velocity resurfaced as today&#x27;s top science discussion.</text>
<circle cx="44" cy="656" r="2.5" fill="#0077CC"/>
<text x="54" y="660" font-size="11.5" fill="#444444">Story drew 298 points on Hacker News</text>
<circle cx="44" cy="673" r="2.5" fill="#0077CC"/>
<text x="54" y="677" font-size="11.5" fill="#444444">Originally posted in 2011, the answer is still circulating 15 years later</text>
<circle cx="44" cy="690" r="2.5" fill="#0077CC"/>
<text x="54" y="694" font-size="11.5" fill="#444444">Explains the relationship via the work-energy theorem, integrating force over distance</text>
<text x="40" y="727" font-size="10" fill="#999999" font-weight="600">IMPACT</text>
<rect x="100" y="717" width="200" height="10" rx="5" fill="#E5E5E5"/>
