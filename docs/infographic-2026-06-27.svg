<text x="54" y="1081" font-size="11.5" fill="#444444">Coverage comes from a June 25, 2026 Economist report on the BBC</text>
<circle cx="44" cy="1094" r="2.5" fill="#E65100"/>
<text x="54" y="1098" font-size="11.5" fill="#444444">Long wave broadcasting in Britain dates back to the early 20th century</text>
