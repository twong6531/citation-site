<text x="40" y="1008" font-size="16" font-weight="bold" fill="#111111">BBC&#x27;s Long Wave Radio Era Set to End</text>
<text x="40" y="1030" font-size="12" fill="#666666">The BBC is set to switch off its long wave radio service, ending an era of</text>
<text x="40" y="1046" font-size="12" fill="#666666">broadcasting that dates back over a century in Britain.</text>
<circle cx="44" cy="1060" r="2.5" fill="#E65100"/>
