  <!-- SECTION: ACTIONABLE TAKEAWAYS -->
  <text x="40" y="1108" font-family="Helvetica Neue, Arial, sans-serif" font-size="9" font-weight="700" fill="#888" letter-spacing="4">ACTIONABLE TAKEAWAYS</text>
  <rect x="40" y="1114" width="720" height="1" fill="#D0D0CC"/>

  <!-- Takeaway 1 -->
  <rect x="40" y="1126" width="4" height="60" fill="#E8FF00"/>
  <text x="56" y="1144" font-family="Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="700" fill="#0F0F0F">
    <tspan>Plan for uneven geographic ridership response when implementing cordon pricing.</tspan>
  </text>
  <text x="56" y="1162" font-family="Helvetica Neue, Arial, sans-serif" font-size="11" fill="#555">
    <tspan>Outer-borough transit agencies should pre-position capacity for modal shift spillovers.</tspan>
  </text>

  <!-- Takeaway 2 -->
  <rect x="40" y="1202" width="4" height="60" fill="#E8FF00"/>
  <text x="56" y="1220" font-family="Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="700" fill="#0F0F0F">
    <tspan>AI route optimization is mature enough to pilot in real-world network redesigns.</tspan>
  </text>
  <text x="56" y="1238" font-family="Helvetica Neue, Arial, sans-serif" font-size="11" fill="#555">
    <tspan>AlphaTransit's open code offers a concrete tool for agencies undertaking bus restructuring.</tspan>
  </text>

  <!-- Takeaway 3 -->
  <rect x="40" y="1278" width="4" height="60" fill="#E8FF00"/>
  <text x="56" y="1296" font-family="Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="700" fill="#0F0F0F">
    <tspan>Bike-share station placement should target equity gaps, not just high demand areas.</tspan>
  </text>
  <text x="56" y="1314" font-family="Helvetica Neue, Arial, sans-serif" font-size="11" fill="#555">
    <tspan>Region representation learning can identify underserved first/last-mile gaps in any city.</tspan>
  </text>

  <!-- Takeaway 4 -->
  <rect x="40" y="1354" width="4" height="60" fill="#E8FF00"/>
  <text x="56" y="1372" font-family="Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="700" fill="#0F0F0F">
    <tspan>Frequency and on-time performance interact—reliability matters most on frequent routes.</tspan>
  </text>
  <text x="56" y="1390" font-family="Helvetica Neue, Arial, sans-serif" font-size="11" fill="#555">
    <tspan>Miami-Dade data: OTP improvements yield larger ridership gains on already-frequent lines.</tspan>
  </text>

  <!-- Takeaway 5 -->
  <rect x="40" y="1430" width="4" height="44" fill="#E8FF00"/>
  <text x="56" y="1448" font-family="Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="700" fill="#0F0F0F">
    <tspan>Free transit programs for targeted groups work—but equity gains peak in restricted areas.</tspan>
  </text>
  <text x="56" y="1466" font-family="Helvetica Neue, Arial, sans-serif" font-size="11" fill="#555">
    <tspan>Highest labor market effects in patriarchal districts with highest pre-existing mobility barriers.</tspan>
  </text>

